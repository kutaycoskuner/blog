t;:[0,&quot;Phaenomenon, Representation and Image&quot;],&quot;created&quot;:[3,&quot;2023-02-03T00:00:00.000Z&quot;],&quot;updated&quot;:[3,&quot;2025-04-08T00:00:00.000Z&quot;],&quot;revision&quot;:[0,1],&quot;language&quot;:[0,&quot;en&quot;],&quot;visibility&quot;:[0,true],&quot;sort_order&quot;:[0,3]}],&quot;body&quot;:[0,&quot;## Notre Dame in Kamburu\r\n\r\nKalabaligin yuhaladigi, igrendigi, korktugu, okuyucunun pek de kolay kendini bagdastiramayacagi bir karakter Quassimodo: Victor Hugo&#39;nun omneli eserlerinden biri olan Notre Dame in Kamburu&#39;nun baskarakteri. Bu yapitla olan tanisikligim kitabi okumadan once Disney in yaptigi animasyon filmiyle gerceklesmisti. Elbette animasyon yapimi, gercek eserden oldukca farkli. Yine de, eserin uzerine kurulu oldugu degerleri yansitiyor diyebiliriz. Kisaca hatirlatmak gerekirse, kitap orta cagda paris in unlu notre dame kilisesinde cancilik yapan kambur Quassimodonun trajik hikayesini anlatiyor. Bu yapimi ozel kilan ve kalici bir yer edinmesini saglayan sey ise — ki elbette o zamanlar bunu bu sekilde ifade edemiyordum. — Beğeni kazanmış pek çok hikâyede gördüğümüz “seçilmiş kişi” (the chosen one) kalıbının neredeyse tam bir antitezi olması. \r\n\r\nKlasik secilmis kisi hikayelerinde, kaderi insanligi kurtarmak olan bir ana karakter (protagonist) karsimiza cikar. Zorluklarla mucadele eder ve karsisindaki dusmani yenerek zafere ulasir. Zaten çoğu zaman bu zafer, bir kader ya da önceden yazılmış bir yazgı aracılığıyla öngörülmüştür. Her şey plana uygun ilerlediğinde ise seyirci bir doyum hissine ulaşır. Populer kulturden birkac ornek vermek gerekirse, Star Wars&#39;in Luke Skywalker&#39;i Matrix&#39;in Neosu, Harry Potter, Naruto, daha klasik ornekelrinde ise Theseus ve Kral Arthur gibi ornekler secilmis kisi hikayelerine ornek olarak sunulabilir. [^1]\r\n\r\nQuassimodo&#39;da ise tam tersini görüyoruz. Ana karakterimiz şanssız doğmuş, canavar gibi görünen, kaderinde dünyayı kurtarmak olmayan bir ezilmiş ve hor görülmüş bir kambur. Hikâyesi de mutlu sonla bitmiyor. Fakat Quasimodo’nun görünüşü ile diğer insanların ona bağdaştırdığı özellikler hiç örtüşmüyor: O, olağanüstü kibar, kimsenin idrak edemediği derinliği ve sevgiyi anlayabilen iyi niyetli bir karakter. Eseri tecrube etmemis okuyuculara daha fazla spoiler vermemek icin burada kesiyorum. Animasyonu izlemenizi ve zaman ayırırsanız kitabını okumanızı şiddetle tavsiye ederim.\r\n\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;/linked_assets/blog/20230203-imge_ve_olgu/20250326-disney-hunchback-of-notre-dame-review-1996-1-780x470.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 1.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Quassimodo by Disney. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1996. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://www.hollywoodintoto.com/wp-content/uploads/2021/07/disney-hunchback-of-notre-dame-review-1996-1-780x470.jpg&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nPeki, bu kitabın benim için anlamı neydi? Notre Dame’ın Kamburu, klasik “chosen one” hikâyelerindeki doruk noktaya ulaşan bir yapım değil; sonunu söylemeye gerek yok, ama sizi imge ile olgu arasındaki farkı derinlemesine sorgulamaya itiyor. Quasimodo’dan bireye genellersek: Bir kişinin karakteri ile dış görünüşü her zaman örtüşmeyebilir. Çok iyi ve düzgün görünen biri kötü niyetli olabilirken, korkunç görünen birisi aslında çok iyi kalpli olabilir. Cok iyi ve duzgun gorunen birisi cok kotu olabilirken, korkunc gorunen birisi, aslinda cok iyi kalpli olabiliyordu. Bir diger degisle, goruntu ile icerik bagdasmayabiliyordu.\r\n\r\nBu kavramları bir üst iterasyonda, daha kuramsal bir perspektiften ele alırsak: Doğadaki her nesne, olay veya düşünce (bu yazıda “olgu” olarak adlandırılacaktır), bizim ona dair algımız ve deneyimlerimiz doğrultusunda zihnimizde bir imge oluşturur. Dünyayı ve çevremizi, bu imgeler üzerinden deneyimleriz. Olgu, bizim onu algılama ve yorumlama şeklimizle imgeyi oluşturduğu için, bu iki kavram arasında önemli farklılıklar olabilir. Daha doğru bir ifadeyle, olguyu birebir kopyalayamayacağımızdan, her imge olguya dair bir referans veya gösterge olarak var olur. Bu durum bu yazinin ana onermesi olan su ifadeyi gösterir: İmge ile olgu arasında doğrudan bir bağlantı olması şart değildir.\r\n\r\n\r\n**Literaturde Imge ve Olgu**  \r\n\r\n\r\nYazinin ana konusu olan bu kavramlar arasindaki iliski farkli arastirmaci ve dusunurler tarafindan farkli sekillerde yorumlanmistir. Bu nedenle, oncelikle bir tanim setiyle baslamanin faydali olacagini dusunuyorum. \r\n\r\n**Olgu:** gerceklikteki nesnenin kenididir.\r\n\r\n**Temsil:**: Gosteren veya gosterge, bir olgunun bir farkli bir sey ile belli parametreler ile gosterilmesi durumu. Ornegin yazi, resim vs. Burada belki belirtmemiz gereken temsilin genelde gercek ve aslinda kendi ayrik bir olgu olusu olabilir. Temsil ile olgu arasinda bir bag olma zorunlulugu olmamakla beraber, genelde olguya ait belli parametrelerden uzerinden bir bag kurulur. \r\n\r\nBunu asiri somut bir ornekle aciklayacak olursak bir satranc oyununu oynayan A ve B kisilerini ele alalim. Satranc tahtasinda, A kisisi beyaz B kisisi ise siyah taslarla oynasin. Olgu A kisisi, temsil objesi olan beyaz renk arasinda herhangi bir baginti olmak zorunda degildir. Nitekim, herhalde her satranc oyuncusu farkli oyunlarda hem beyaz hem de siyah saclarla oynamistir. \r\n\r\n**Imge:** Imge ise, olguya ait zihinde olusan tezahurdur, imge algisaldir ve degisiklik gostereiblir.\r\n\r\nDaha cok felfesi ve linguistik bir tartismanin konusu olan bu temaya bircok sey dahil edilebilse de, konuyu benzer terminolojiyle ele alan iki kisiden bahsedebiliriz: Ferdinand Saussure [^2] ve Ludwig Wittgenstein. [^3]\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img40\&quot; src=\&quot;/linked_assets/blog/20230203-imge_ve_olgu/20250318-saussure_signified-signifiant.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 2.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Signifier-Signified by Saussure. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1916. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://upload.wikimedia.org/wikipedia/commons/d/d6/Saussure_Signifie-Signifiant.png&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nDusunurler, belirtilen olgular arasindaki iliskiyi birbirinden farkli sekillerde kurgularlar. Ornegin, olgudan temsile, temsilden imgeye hiyerarsik bir gecis oldugunu iddia edenler de, temsilin de bir olgu, ve temsilin de bir imge oldugunu belirten argumanlar vardir. Bu yazida daha karmasik bir analiz gerektiren temsil kavrami linguistik ve felsefi bir tartismaya ihtiyac duyacagindan icerigin kismen disinda birakilmistir. Imge ve olgu gibi daha basit tanim kumeleri yapilabilecek kavramlarla, gundelik hayatimizdaki izdusumlerine odaklanilmistir. \r\n\r\nPeki, bu görece bariz görünen bilginin üzerine yazı yazılacak kadar önemli olan nedir? Kuramsal araştırmanın doğası gereği ortaya çıkan soyut bir bilgi gibi görünse de, imge ve olgu ayrımını yapabilmek ve bu iki olgu arasındaki ilişkinin türünü tanımlayabilmek, bize şaşırtıcı şekilde hem günlük hayatımızda hem de toplumsal ve çevresel olarak daha adil ve ideal olanı inşa etme konusunda bazı dusunsel yapitaslari sunabilir.\r\n\r\nPeki nasil? bu durumu aciklamak icin ilk basta yuzen kavramlarin hatlarini orneklerle biraz daha belirginlestirelim. \r\n\r\n\r\n## Disiplinler bazinda ornekler\r\n\r\n**Bilgisayar bilimi**\r\n\r\nImge ve olgu arasindaki fark farkin dile getirilmesi farkli disiplin ve baglamlarda tekrar tekrar gozumuzun onune geliyor. Ornegin, Enformatik bilimi, bilgisayarlarda bilgiyi depolarken bunlari her zaman ayni olan acik veya kapali olan bit birimi ve bunlarin kombinasyonlari seklinde ifade eder. Bir bilgisayar bilimci cok iyi bilir ki, ifade edilen bilginin her zaman semboliktir. Bu obje temelli programlamada yine goze carpar. Konu hakkinda bilgisi olmayan okuyucular icin dahi guzel bir ornek olarak Craig Larmann in Applying UML and Patterns kitabi verileiblir. Kitap her ne kadar felfefi bir ciktidan ziyade, dogrudan islevsel temsil mekanizmalarina odaklansa da, kapaginda  farkli temsil mekanizmalarinin olasiligi ve bu olasiliklarin yarattigi firsat ve kisitlamalara deginilmistir.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img40\&quot; src=\&quot;/linked_assets/blog/20230203-imge_ve_olgu/20260316-applying_uml_and_patterns-18779749133.jpg\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n\r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 3.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Book Cover of Craig Larman Applying UML and Patterns. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1997. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://m.media-amazon.com/images/I/71XTPbPx5jL._SL1500_.jpg&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nBilgisayar biliminde veri yapıları, bir bilgi modelinin ikilik (binary) düzende nasıl temsil edileceğini belirleyen bir kurgu olarak tanımlanabilir. Sayılar ve karakterler gibi temel veri tipleri, herkes için ortak olan ve standartlaştırılmış temsillere sahip daha basit yapı taşlarıdır. Buna karşılık, programın ihtiyaçlarına göre şekillenen daha karmaşık veri yapıları, verinin nasıl algılandığı ve nasıl işlenmek istendiği doğrultusunda tasarlanan soyut kurgusal yapılardır.\r\n\r\nBu kurgular, farklı programlama paradigmaları içerisinde farklı biçimlerde modellenebilir ve her tasarım kendi içinde belirli avantajlar ve dezavantajlar barındırır. Sonuç olarak, verinin temsil biçimi aynı zamanda onun nasıl düşünüldüğünü ve hangi bağlamda anlam kazandığını da belirler.\r\n\r\nİmge, temsil biçimini şekillendirir.\r\n\r\n\r\n**Matematik**\r\n\r\nBir baska baglamda ise, belki biraz felsefi olan matematik kesif midir icat mi sorusunu belki duymussunuzdur. Bu soruya bir cevap aramak bu yazinin niyeti olmamakla beraber, okuyucunun dikkatini dagitmadan verdigi referensa odaklanmak istiyorum. Aslinda bu soru matematigin imge ve olgu mu oldugu seklinde de yorumlanabilir. Bu deneme yazisinda bu soruya cevap vermek gibi bir amac gutmuyorum. Fakat konuya dair iyi bir ornek oldugunu dusundugum icin ekledim. Olgu tek ve essiz iken,  imge cogul ve farkli sekillerde ortaya cikabilir. Bu druum bize bazi avantajlar saglarken, hemen ayni zamanda da bizi belli bir dusunce sekline kanalize ettigi icin belli sekilde de kisitlar, fakat bu kisitlamalar her zaman bariz olmayabilir. \r\n\r\nBir başka bağlamda, belki de daha felsefi bir tartışma olan “matematik keşif midir yoksa icat mı?” sorusunu duymuş olabilirsiniz. Bu yazının amacı bu soruya bir yanıt aramak olmasa da; bu yazinin ele aldiğı konu bağlamında tartısılabilir. Nitekim soru, aynı zamanda matematiğin bir “imge” mi yoksa bir “olgu” mu olduğu şeklinde de sorulabilir.\r\n\r\nBu denemede bu soruya doğrudan bir cevap verme amacı güdülmemektedir. Bununla birlikte, konuya dair açıklayıcı bir örnek sunduğunu düşündüğüm için metne dahil edilmiştir. Olgu tekil ve benzersizken, imge çoğul olabilir ve farklı biçimlerde ortaya çıkabilir. Bu durum bize çeşitli avantajlar sağlarken, aynı zamanda düşünce biçimimizi belirli yönlere kanalize ederek bizi sınırlayabilir. Ancak bu sınırlamalar her zaman açık ve görünür değildir.\r\n\r\nMtaematik bize, temsil mekanizmalari araciligiyla gercekligi basitlesirip zihnimizde modelleyebilme olanacagi saglar. Ornegin François Viète ve Rene Descartes basta olmak uzere onlarca matematikci, bugunku cebirsel gosterimlere katki saglamistir. 16. yuzyildan once ancak geometrik olarak ifade edilen denklemler. Zamanla yazinsal formata dokulebilmis, bu notasyon ise, zihinsel algi gereksinimi devre disi birakarak, kavramlari kagit uzerinde belirli kurallarla calisilabilir yapmistir. Bir zamanlar, donemiminin en yuksek matematikcilerinin ugrastigi denklemler bu temsil mekanizmalari sayesinde bugun orta okul-lise seviyesindeki ogrenciler tarafindan cozulebilir olmustur. Konuyla ilgili Veritasium kanalinin hayali sayilarin icadi uzerine guzel bir video var izleminizi tavsiye ederim. [^4]\r\n\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;/linked_assets/blog/20230203-imge_ve_olgu/20260310-geo_alg_rep.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 4.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Geometric and Algebraic Representation by Veritasium. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 2021. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://youtu.be/cUzklzVXJwo?t=183&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nÖrneğin, Mathematica sisteminin ve Wolfram Language’in geliştiricisi olan Stephen Wolfram, matematiğin bir yönüyle “icat” olarak ele alınabileceğini öne sürmektedir. Ona göre, modern matematiğin dayandığı aksiyom sistemini değiştirdiğimizde, aslında tamamen farklı bir matematiksel evrenle karşılaşırız.\r\n\r\nBu bakış açısına göre, hangi problemlerin çözülebilir olduğu ve hangi sonuçlara ulaşılabileceği, seçilen aksiyomlar tarafından belirlenir. Dolayısıyla matematik, sabit ve tekil bir yapı olmaktan ziyade, temel varsayımlar üzerinden ekillenen bir sistemler bütünü olarak görülebilir. [^5]\r\n\r\n&lt;div class=\&quot;quote-block\&quot;&gt; \r\n    &lt;div class=\&quot;quote-main\&quot;&gt; \r\n        What we observe is not nature itself, but nature exposed to our method of questioning.\r\n    &lt;/div&gt;\r\n        &lt;div class=\&quot;quote-cite\&quot;&gt;\r\n        &lt;span class=\&quot;quote-author\&quot;&gt; Werner Heisenberg. &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-src hidden\&quot;&gt; &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-date\&quot;&gt; 1927. &lt;/span&gt;\r\n    &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n\r\n\r\n**Sanat** \r\n\r\nYukarıda bahsedilen disiplinlere ek olarak, imge, olgu ve temsil arasındaki ilişki, sanatçıların da yoğun olarak ele aldığı bir konudur. Bu ayrım, temsil mekanizmaları arasındaki kabulün gücünü gösteren iyi bir örnek sunar.\r\n\r\nRené Magritte’in çalışmaları bu bağlamda özellikle dikkat çekicidir. “Pipo” eserinde, aynı olguya dair farklı imgeler birbiriyle çelişir biçimde sunulur. Ancak burada önemli nokta, hem resmin hem de yazının yalnızca birer temsil olmasıdır. Pipoya dair resim de, yazı da, olgunun kendisi değil; ona dair farklı temsil biçimleridir.\r\n\r\nProblem ise, bireyin bu temsiller arasından hangisini “doğru” olarak benimsediği noktasında ortaya çıkar. Bu durumda bir trikotomi ile karşılaşırız: Yazı mı doğrudur, resim mi doğrudur, yoksa her ikisi de mi yanlıştır?\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img40\&quot; src=\&quot;/linked_assets/blog/20230203-imge_ve_olgu/20250318-magritte_pipe.jpg\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 5.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; The Treachery of Images by René Magritte. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1929. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://en.wikipedia.org/wiki/File:MagrittePipe.jpg&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nMagritte, bu meseleyi sanatı aracılığıyla bir tartışma alanı olarak ortaya koymuştur. Burada varılan nokta şudur: Seçtiğimiz imgeler, olguya ve gerçekliğe dair algımızı şekillendirir; bu algıların bütünü ise toplumumuzu, içinde bulunduğumuz yapılı çevreyi, dünya görüşümüzü ve dolayısıyla nasıl yaşadığımızı belirler.\r\n\r\nİmge ile olgu arasındaki ilişki, bir ya da birden fazla parametre üzerinden kurulabileceği gibi, hiçbir zorunlu bağa da dayanmayabilir. Yani imge ile olgu arasında doğrudan bir karşılık ilişkisi bulunma zorunluluğu yoktur.\r\n\r\nBuradaki temel risk, imgenin bir manipülasyon ve kontrol aracı olarak kullanılabilmesidir. Çünkü imgeyi şekillendiren yapı, aynı zamanda düşünme biçimimizi de yönlendirebilir. Bu durum, bireyi var olmayan bir şeye inandırabilir, olasılık alanını daraltabilir ya da mevcut olmayan olasılıkların varlığına ikna edebilir.\r\n\r\nToplumsal düzeyde ise imgelerin kabulü, yalnızca bireysel algıyı değil; o topluluğun aktif olduğu yapılı çevrenin nasıl evrileceğini de belirler. Bu ayrımın kuramsal çıktılarına değinmeden önce, gündelik yaşamda imgenin gücüne dair daha somut örnekler üzerinden örneklerimizi genişletebilriz.\r\n\r\n## Somut ornekler\r\n\r\n**Reklamlar**\r\n\r\nReklam, genel kabul gören tanımıyla, bir ürünün, hizmetin veya etkinliğin tanıtımı ve teşviki amacıyla gerçekleştirilen iletişim faaliyetleridir. Neoliberal yapının domine ettiği günümüz dünyasında reklam, neredeyse herkesin sürekli maruz kaldığı yaygın bir olgu haline gelmiştir.\r\n\r\nReklam üreticilerinin sıklıkla kullandığı tekniklerden biri, bireylerin düşünce yapıları içerisinde kendi deneyim ve duygularıyla ilişkilendirebilecekleri pozitif imgeler oluşturmaktır. Bu yöntemle ürün ya da hizmet, doğrudan özellikleri üzerinden değil, duygusal çağrışımlar ve kültürel imge setleri üzerinden anlamlandırılır. Böylece imge, algının kurucu bir bileşeni haline gelir.\r\n\r\nBuna tarihsel olarak en bilinen örneklerden biri De Beers’in 20. yüzyılın ortalarında, özellikle 1947 yılında başlattığı “A Diamond is Forever” sloganıyla yürüttüğü kampanyadır. Bu kampanya, elmas ile “sonsuz aşk” kavramı arasında güçlü bir imgesel bağ kurarak, elması yalnızca bir mücevher olmaktan çıkarıp evlilik ve bağlılık ritüelinin neredeyse zorunlu bir sembolüne dönüştürmüştür. Böylece ekonomik bir ürün, toplumsal bir norm ve duygusal bir zorunluluk gibi algılanmaya başlanmıştır.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;/linked_assets/blog/20230203-imge_ve_olgu/20260308-de_beers_diamond.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 6.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; De-Beers Commercial. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1997. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://www.youtube.com/watch?v=8pU6WQXkiOU&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\n\r\nNadirliği ve sertliği nedeniyle bir zamanlar oldukça değerli taşlar arasında kabul edilen elmaslar, endüstri devriminin getirdiği teknolojik ve ekonomik imkânlar ile 19. yüzyılda (özellikle 1870’lerden itibaren Güney Afrika’da büyük elmas yataklarının keşfiyle) sanıldığı kadar da nadir olmadığının anlaşılmasıyla yeni bir üretim ve dağıtım sürecine girmiştir. 20. yüzyılda ise sentetik elmas üretiminin mümkün hale gelmesiyle birlikte, aslında nadirlik temelinde değerlendirildiğinde büyük ölçüde “istisnai değer” iddiasını kaybetmiş bir materyal haline gelmiştir.\r\n\r\nBuna rağmen elmas, değerini kaybetmek yerine daha da güçlendirmiştir. Bunun temel nedeni, üretim ve dağıtımını kontrol eden yapıların, ekonomik tekelleşmenin yanı sıra başarılı bir imge yönetimi kurabilmiş olmalarıdır. Özellikle De Beers tarafından yürütülen reklam kampanyaları, elması yalnızca bir mineral olmaktan çıkarıp kültürel ve duygusal bir zorunluluk nesnesine dönüştürmüştür.\r\n\r\nBu süreçte elmasın “nadirliği”, aşkın nadirliği ile; “sertliği” ise aşkın ve bağlılığın sonsuzluğu ile analojik olarak ilişkilendirilmiştir. Bu bağlantılar doğrudan değil, dolaylı ve duygusal imgeler üzerinden kurulmuş; böylece elmas yüzük, özellikle evlilik ritüelinde neredeyse evrensel bir norm haline gelmiştir.\r\n\r\nSonuç olarak, günümüzde elmas ne gerçek anlamda nadir ne de özsel olarak benzersizdir. Ancak bu durum, onun toplumsal ve ekonomik değerini belirlemede belirleyici değildir. Asıl belirleyici olan, imgenin nasıl kurulduğu ve bu imgenin olguya dair algıyı nasıl şekillendirdiğidir. Bu da önceki tartışmalara geri döner: imge ile olgu arasındaki ayrım, pratik dünyada çoğu zaman ikincil kalır; esas güç, imgenin üretim ve kabul mekanizmasında yatar.\r\n\r\n\r\n&lt;div class=\&quot;quote-block\&quot;&gt; \r\n    &lt;div class=\&quot;quote-main\&quot;&gt; \r\n        imagination rules the world.\r\n    &lt;/div&gt;\r\n        &lt;div class=\&quot;quote-cite\&quot;&gt;\r\n        &lt;span class=\&quot;quote-author\&quot;&gt; Napoléon Bonaparte &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-src\&quot;&gt; &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-date\&quot;&gt;  &lt;/span&gt;\r\n    &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n**Para**\r\n\r\nPara kavramı da, güncel bağlamda imge ile olgu arasındaki farkın güçlü bir örneği olarak ele alınabilir. Değişim aracı olarak para, her değerle takas edilebilen ortak bir ölçüt olarak kurgulanmış, temelde ise toplumsal bir uzlaşıya dayanan yapay bir sistemdir.\r\n\r\nBu anlamda para, fiziksel bir nesneden ziyade kurgusal bir değer temsilidir. Ortak bir ticaret aracı olarak düşünüldüğünde, böyle bir sistemde aranan bazı temel özellikler ortaya çıkar: dayanıklı olması, zaman içinde bozulmaması, zararlı olmaması (örneğin radyoaktif ya da kimyasal açıdan risk taşımaması), kolayca temin edilememesi ve en önemlisi sahteciliğe karşı dirençli olması gibi özellikler sıralanabilir.\r\n\r\nBu özellikler, paranın fiziksel varlığından çok onun temsil ettiği “değer imgesi”nin güvenilirliği ile ilgilidir. Yani para, kendi başına değeri olan bir nesne değil; değer kavramına dair ortak bir imgenin somutlaşmış halidir.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;/linked_assets/blog/20230203-imge_ve_olgu/20260313-evolution_of_money1643723849304.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 7.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Evolution of Money. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 2022. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://www.linkedin.com/pulse/from-barter-crypto-evolution-money-ankur-sinha/&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\n\r\nAltın, bu özellikleri büyük ölçüde taşıdığı için uzun yıllar boyunca uygun bir ticaret metası olarak kullanılmış, günümüzde ise yerini madeni para ve banknotlara bırakmıştır. Ancak nihayetinde, çeşitli sahteciliği önleyici süreçlerden geçirilse ve üretimi kontrollü şekilde yapılsa da, günümüz para sistemi büyük ölçüde kâğıt ve düşük değerli metaller üzerine kuruludur.\r\n\r\nDahası, farklı ülkelerin para birimleri arasında birimsel olarak oldukça büyük değer farklılıkları bulunmaktadır. Hatta bu durum, paranın mutlak ve evrensel bir değer olmaktan ziyade, toplumsal ve ekonomik uzlaşıya dayalı göreli bir sistem olduğunu göstermektedir.\r\n\r\nBir adım daha ileri gidildiğinde, parayı fiziksel bir nesneden çok, bireyler arasındaki değer transferlerini kayıt altına alan ve değiştirilemeyen bir sistem olarak yorumlamak mümkündür. Bu açıdan bakıldığında, günümüzde kullandığımız dijital para sistemleri ve blokzincir temelli yapılar, neredeyse bilim kurguya ait bir senaryoyu andıran soyut bir para anlayışına işaret etmektedir.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img80\&quot; src=\&quot;/linked_assets/blog/20230203-imge_ve_olgu/20260310-money.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 8.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Various forms of money. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://p.turbosquid.com/ts-thumb/N4/nYWscS/GhlisZ8D/septimcoinsfinalrender5/png/1380723897/1920x1080/fit_q87/8b309a29550aee0c247f3424b9205b36c47f59d1/septimcoinsfinalrender5.jpg&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://www.ihath.com/wp-content/uploads/2019/04/money-2-1024x549.png&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;unknown&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\n\r\n\r\nPeki bir para biriminin veya para sisteminin değerli olduğuna kim, nasıl karar verir? Temelde bu durum, insanlar ve organizasyonlar tarafından sahip olunan politik ve ekonomik güç ile birlikte, belirli bir para biriminin “değerli” olduğuna dair oluşan ortak imge üzerinden şekillenir.\r\n\r\nBurada ortaya çıkan kabul, yani imgesel yapı, aslında dikkatle tasarlanmış bir kâğıt parçası olan fiziksel olgudan çok daha güçlü bir değer üretir. Böylece imge, somut nesnenin kendisinden bağımsız olarak, onun algılanan değerini belirleyen asıl faktöre dönüşür.\r\n\r\nKonuyu daha fazla dağıtmamak ve siz okuyucuyu yormamak adına, bu örneklerin ana fikri açıklamak için yeterli olduğunu düşünerek burada sonlandırıyorum. Ancak ilginizi çektiyse, imge ve algı olgularının ele alındığı dikkat çekici bazı örnekleri yazının sonunda bulabilirsiniz.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;/linked_assets/blog/20230203-imge_ve_olgu/20260313-sx4zpHI0-600x338.jpg\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 9.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; &#39;Bird Trick&#39; by Alfred Borden in Prestige. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 2006. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://whatculture.com/film/10-even-more-movies-with-ridiculously-subtle-foreshadowing?page=9&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\n\r\n\r\n&lt;div class=\&quot;quote-block\&quot;&gt; \r\n    &lt;div class=\&quot;quote-main\&quot;&gt; \r\n        The secret impresses no one. The trick you use it for is everything.\r\n    &lt;/div&gt;\r\n    &lt;div class=\&quot;quote-cite\&quot;&gt;\r\n        &lt;span class=\&quot;quote-author\&quot;&gt; Alfred Borden. &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-src\&quot;&gt; Prestige. &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-date\&quot;&gt; 2006. &lt;/span&gt;\r\n    &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n\r\n## Imgenin yapili cevre ve toplumu sekillendirmesi\r\n\r\nBu noktaya kadar ele alınan örnekler, imgenin yalnızca soyut bir kavram olmadığını; aksine ekonomik, toplumsal ve kültürel yapıları doğrudan şekillendiren aktif bir unsur olduğu konusunda siz okuyucuyu kismen ikna edebildigimi umuyorum. \r\n\r\nAsıl konuya geri dönecek olursak, varoluştaki olgulara dair yarattığımız imgeler, bireysel algımızı şekillendirir. Bu algıların zamanla ortaklaşması ve genişlemesi (yani kabullerimiz), içinde yaşadığımız toplum, yapılı çevre ve genel dünya tasavvurumuzun nasıl kurulacağını belirler.\r\n\r\nBununla birlikte, imge ile olgu arasındaki ilişkinin zorunlu olmaması, imgelerin ve dolayısıyla onların ürettiği gerçeklik algısının manipüle edilmesine ve kontrol edilmesine de imkân tanır. Bu durumun bir örneğini, mimarlık eğitimim boyunca Quasimodo üzerinden ele alınan ve farklı bağlamlarda tekrar eden bir ornek olay üzerinden açıklamak istiyorum.\r\n\r\nHer canlı, içinde doğduğu ve yaşadığı çevreyi bir şekilde kullanır; ancak bazı türler bu çevreyi, kendi yaşam koşullarını daha ideal hale getirmek amacıyla yeniden şekillendirir. Bunu, bir örümceğin ağ örmesi ya da bir kuşun yuva yapması gibi örneklerle açıklayabiliriz.\r\n\r\nİnsan ise, sahip olduğu organizasyonel karmaşıklık ve bilişsel kapasite sayesinde, bu çevresel dönüşümü bildiğimiz canlılar arasında en büyük ölçekte ve en yüksek etkiyle gerçekleştirebilen varlıktır.\r\n\r\nBu eylemi insan toplumlarında gerçekleştiren aktörlerden biri mimardır. Mimar, yapılı çevredeki dönüşümü; kullanıcı beklentileri, doğal çevreye etkiler, ışık, hava ve su kontrolü, toplumsal fayda, ulaşım, estetik, yaratıcılık, organizasyonel düzenleme, ekonomik etkiler ve sosyal ve politik ciktilar gibi hem doğrudan gözlemlenebilir hem de kimi zaman varsayımsal birçok parametreyi göz önünde bulundurarak yönetir.\r\n\r\nBu çok katmanlı değerlendirme süreci içerisinde amaç, gerçekleştirilen değişimin olası faydasını maksimize etmektir.\r\n\r\nModern ve kurumsallaşmış eğitimde kabul gören düşünceyi kabaca ifade edersek, mimarın bir rol olarak meşruiyeti; yalnızca bir yapıyı veya yapılı çevreyi tasarlayabilmesinden değil, bu tasarımın yaratacağı etkileri bütüncül bir şekilde öngörebilmesi ve buna dair gerekçeler üretebilmesinden gelir. Yani mimar, gerçekleştireceği müdahaleye ilişkin nedenler sunabilen kişidir.\r\n\r\nBu nedenle hem mimarlık eğitiminde hem de yapılı çevre üretiminde, bir yapı çoğu zaman somut bileşenlerinin (duvar, kolon, beton, pencere vb.) ötesinde, daha soyut kavramlar ve nitelikler üzerinden tanımlanır. Özgürlük, geçirgenlik, sürdürülebilirlik, yenilik gibi kavramlar neredeyse her tasarımın söylemsel temelini oluşturur.\r\n\r\nBu yaklaşımda tasarım, fiziksel nesnelerin doğrudan üretiminden ziyade, kavramsal bir zeminde kurulur; yapı, bu kavramsal çerçeve üzerinden gerekçelendirilir. Sonuçta ise, başlangıçta ortaya konan kavramların mekânsal ve deneyimsel olarak mimari üzerinde temsil edilmesi ve yaşantıya dönüşmesi beklenir.\r\n\r\nBöylece, nedenselliği kuran kavramlar kümesi ile üretilen mimarlık arasında bir olgu–temsil–imge ilişkisi ortaya çıkar.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;/linked_assets/blog/20230203-imge_ve_olgu/20260313-Villa-Savoye-Le-Corbusier-1920x1280.jpg\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 9.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Villa Savoye by Le Corbusier. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1931. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://en.wikiarquitectura.com/building/villa-savoye/&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nYukarida gormus oldugunuz gorsel, modern mimari kuramini elle tutulur prensiler uzerine kurgulayan Le Corbusier, b\r\n\r\n\r\nKlasik bir ornek olarak, genelde mimarlik egitimi almamis olan kisiler arasinda barok saraylar ya da postmodern organik mimari alisilagelmisten olan farkliligi nedeniyle iyi mimari olarak siniflandirilir. Siradisiligi ve bir biblo gibi goze hitap eden bir varolus sergilemesi bu sonuca varilmasindaki en buyuk girdi olarak nitelendirilebilir. Bu mimarinin bizim zihnimizde olusturdugumuz imge ve vardigimiz yargiyi olusturur. Fakat mimarlik sadece ilginc bir formu yaratmaktan fazlasiyla mukelleftir. Bastaki tanima donecek olursak, mimari yapili cevrenin canlinin cikarlari dogrultusunda degistirilmesi, ve sonuc olarak hayati duzenleme fonksiyonu oldugundan kacinilmaz olarak politiktir. Burada siradisilik ve formal yaraticilik mimari kaliteyi tanimlamak icin yetersiz kalir. Bu durumu daha derinden incelemek gerekir. Zihinsel imgeden, temsile ve temsil edilen olgulara ulasirsak ancak mimariyi dogru olarak yorumlayabiliriz. \r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;/linked_assets/blog/20230203-imge_ve_olgu/20250320-duck_and_decorated_shed.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n        &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 10.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Duck and decorated shed by Robert Venturi, Denise Scott Brown, and Steven Izenour. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1972. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://99percentinvisible.org/wp-content/uploads/2016/08/duckandds.png&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\n\r\nOrnegin bir saray, otoriteye ait bir yapidir. Otorite sarayi yaptirirken mekansal ihtiyactan ziyade, gosterisi onceliklendiriyorsa, buradaki kaygi daha cok gucun elestririden ziyade saygi gordugu bir toplumda guc gosterisi yapma amaci tasir. Paralel olarak, durumun ekonomik ve emek maliyeti, insanlarin hayat kalitesinden ziyade, guclunun gucunu muhafaza etme gayesine kayar. Sonuc itibariyle, sarayin temsil ettigi olgu asil yapili cevrenin butuncul fayda gayesinden kayearak, bireysel fayda gayesi uzerinde sekillenir. Yani mimarinin temsili, otoritenin gucunu yansitmaktir. Bu olgu otorasiye yakinsar. Despot bir yonetimin, gucunu yansitmaya calistigi yapi, imgeden olguya dogru bakmaya basladiginizda acinasi gorunur. Eger siz bu toplumun bir parcasiysaniz, o sarayin varligi sizin hayat kalitenizi arttirmaz, aksine hayat kalitenizin dusmesinin sebebi olarak varolur. \r\n\r\nYapili cevre politik oldugu icin ayni zamanda, icinde bulundugu toplumun algi ve kabullerinin bir eseridir. Bizim uzerinde yasadigimiz imgeler manipule edilmemize manipule edilmemiz de baskalarinin bizi kontrol edebilmesine yol acar. Dolayisiyla, imge ve algi arasindaki bagimsizligin ayrimini yapabilmek onemlidir.\r\n\r\nKonudan sapmadan geri donecek olursak, yasadiginiz mekanlarda gordugunuz ve sadece farkliligi ve ilgincligi uzerinden degerlendiridiginiz mimari ve mekanlar aslinda o mekanlara dair imgedir. Daha derin bir okuma yaparak olgunun ne oldugu anlamak, mimariyi daha derinden incelemeyi ve okumayi gerektirir. Bu da onu yaratan ve politikadan bagimsiz olmayan prensipere baglidir.\r\n\r\nMimarligin sadece gorunum veya keyifli gorunen mekanlarla ilgili degildir. Mimarlik kacilnilmaz olarak politiktir (todo: gas referansi) toplumun kullanacagi mekanlari politikalar, ihtiyaclar, sosyoloji, ekonomi, teknoloji, temel bilimler, geometri, matematik ve sanatsal yaraticilik ile sekillendiren icine sinirsiz faktor ve parametrenin dahil edilebilecegi ve sonunda toplumun yasayis seklini belirleyen / degistiren cok boyutlu bir kavramdir. Mevcut otoritenin takdirinde, guc verilerek olusturulan mekanlari ureten kimselerin olusturdugu mekanlar mimarligin yoksunlugunu degil, o mekanlari yaratan ve kullanan toplumun carpikligini gosterir. Bunu bir baska ve daha temiz bir ornekle aciklayacak olursak kral, kralin gerekliligine ikna olmus olan insanlarin kolektif bilinciyle varolur. Olgu ile imgenin farkina ait farkindalik, bizim elestirel dusunceyi tetikler.\r\n\r\n## Conclusion\r\n\r\nBu yazinin ana onermesi Imge, algi ve olgunun arasinda dogrudan bir baglanti olmak zorunda degildir. Bu fark basit ve temel bir gerceklik gibi gorunse de, gundelik hayatimizda siklikla unutup gormezden geldigimiz bir seydir. Bu iki kavram arasindaki fark, yasadigimiz tecrube durum ve olaylara bakisimizda elestirel dusunceyi gelistirmemize, kendimize bir savunma mekanizmasi olusturmamiza, ve karsilastigimiz durumlara, olaylara daha derinlemesine bakarak alt-metin okumalari yapabilmemize olanak saglar(gorme bicimleri referansi). Manipulasyondan korur ve daha yuksek bir bilince ve kendimizi ve isteklerimizi sekillendirebilmemize yardimci olur.\r\n\r\nImge ile olgunun kendisi ile dogrudan bir baglanti olmak zorunda degildir.\r\nfarkindalik, alt metin okuma, her sey gorundugu gibi degildir. elestirel dusunce\r\n\r\nAyni fizik formullerinde oldugu gibi, bizim gerceklgiin nasil isledigine dair yaptigimiz formul seklinde ifade edilen tezahurlar, ona dair\r\n\r\nimge olgu farki -&gt; elestirel dusunce -&gt; bize yasadigimiz yapinin kurgusal oldugunu belirtir -&gt; daha iyi ve guzeli yaratmak elimizdedir fakat bunun icin elestirel dusunup ... kosullar.\r\n\r\n**Bibliography**\r\n[^1]: Kötüler Sofistikedir, İyiler Vasat. (Accessed 17 Mar 2026) https://web.archive.org/web/20161119041938/http://fabilog.com/kotuler-sofistikedir-iyiler-vasat/ \r\n\r\n[^2]: SAUSSURE, Ferdinand de. _Course in General Linguistics_. London: Duckworth. 1983. Original work published in 1916.\r\n\r\n[^3]: WITTGENSTEIN, Ludwig. _Tractatus Logico-Philosophicus_. London: Routledge. 2001. Original work published in 1921.\r\n\r\n[^4]: Veritasium https://www.youtube.com/watch?v=cUzklzVXJwo\r\n\r\n[^5]: stephan wolfram is math   https://www.youtube.com/watch?v=nUCwtLTUPQ4\r\n\r\n**Appendix**\r\n\r\n1. 20. yuzyil filozoflarinin da, uzerine dusundugu seylerden biri: Imgelerin gercekligi sekillendirip sekillendirmedigi uzerinedir. Nitekim bu konu 1990larin unlu filmi matrixde de ele alinmistir. \r\n\r\n\r\n\r\n&lt;div class=\&quot;hidden\&quot;&gt;\r\n    ### discarded\r\n\r\n    Secilmis kisi hikayelerinde gordugum mantiksal problemi bir yana birakarak bu yazida ... Notre dame in kamburu hikayesini asiri sevmeme neden olan ve sonralardan bu sablondan duydugum rahatsizligi ancak yillar sonra kendime ifade edebilmistim. Hikaye beni rahatsiz eden yapiyi cok daha sonralardan kendime izah edebildim ki bunu bu yazinin odagini saptirmamak icin baska bir yaziya sakliyorum. Ama kabaca, secilmis kisi hikayelerinde ana karakterimiz, guclu, sansli, dogrudan vurgulanmasa da genelde yakisikli/guzel/karizmatik ve kaderi dunyayi kurtarmak olan kisidir.\r\n\r\n    ----------\r\n\r\n    Dunya uzerinde dusunce yapisinin kirilip epistemin degistigi her donem, varolan ve genel tarafindan kabul edilen dusunce sekline bir takim radikal degisimler getirmistir. Bu degisimler her zaman pozitif veya progresif olmamakla beraber, insanlarin yasam tarzina, sanata ve mekanlara izdusumler birakiyor ve sonucta bizim tarihsel donemleri birbirinden ayirma seklimizi belirledigini dusunuyorum. Ornegin rönesans doneminde insanlarin odagi dini varolusun vaadattigi noktadan yasadigimiz dunyaya kaymis ve bu durum katolik hristiyan otoritelerin toplum ustundeki guclerinin zayiflamasina neden olmustur. Nitekim takip eden barok doneminde, otoritenin lokal militer gucu elinde tutan asiller tarafindan yeniden ele alinip mesruiyetlerinin kabul edildigini ve sahip olduklari gucleri mekanlardaki eksessiv ornamentasyon ile disa vurduklarini gozlemleyebiliriz. Bu degisimlerin bir boyunuda, adeta bir sarkac salinimi gibi, otoritenin guc kazanip kaybettigini gorebiliriz. Nitekim, modern donem ve onu takip eden ayni zamanda su anda icinde yasadigimiz postmodern donemde de benzer patternleri gormenin mumkun oldugunu dusunuyorum.\r\n\r\n    Modern donem, kabaca toplumsal adalet ve gelisim talebinin, bilimin dogru kaaynak olaraak kabul edildigi bir epistemi benimsemisti. Bunu toplum icin yaratilan mekanlara aktarirken olusturacak formal dili bulmaya calisirken ise adeta baroku kendisine bir antitez olarak secmistir. Le Corbusier in dile getirdigi ve genel olarak kabul goren bu ilkelerden ikisi, ornamentasyondan arinma ve mimari cephe kavramina bir krsi durus olarak uniform bir dengeyi benimseme seklinde manifeste edilmistir. Genel tarih ve hatta buna temel bilimleri de ekleyebilriiz, bize neyin oldugunu ogretirken neden oldugu pek ifde edilmiyor.\r\n\r\n    Bu formal prensiplerin arkasinda elbette ki modern dusuncenin temelini olusturan daha ve daha adil bir toplumu amaclayan sosyalsit anlayis vardi. Buna dair getirilen yorumlardan biri, ornamentasyon reddedildi, cunku fonksiyonu hayata dogrudan bir deger katmaktan ziyade gucu temsil edisiydi, otoritenin kendini gosteris araciydi Ayrica finansal acidan maliyetleri arttirdigi icin erisiminin genele yayilmasi zordu. Nitekim cephe de benzer bir sebepten reddedildi, ayni ornamentasyonu gibi cephe, bir gosteris ogesi olarak, butunu temsil etmiyor, yapida gerceklikle bagdasmayan bir algi yaratmayi amacliyordu. Ayni reklam durumunuda oldugu gibi, bilincli olarak etik disi denilebilecek bir sekilde, gerceklikle bagdasmayan bir iluzyon yaratmayi amaclamistir. Nitekim modern donemin sona ermesine takriben, postmodern donemin kultleri arasinda kabul edilen ... in kitabinda cephe kavrami savunulan bir oge olarak yeniden yerini almistir. Cephe kavrami sadece bir yapinin geometrik formunun yuzlerinden biri degil, geneline de yayilabilir. Nitelim, benzer sekilde form follows function (und vice versa todo: ref) tartismalari da bu durumun farkli bir boyutunu yansitir.\r\n\r\n    Modern mimarinini sikici ve donuk kabul edilen formal tonlari, postmodern mimaride kendini populist, dikkat cekici, farkli ve renkli formlara birakmistir. Fakat ayni barokta oldugu gibi gordugumuz yapilar bir guc ve otorite odaginin kendini yeni teknoloji ve form ile resmetme seklidir. Arkadaki prensip ise baroktan cok farklilik gostermez. Nitekim, postmodern donem ayni zamanda neolibral nutuklar ile kapitalizmin ve gucun tek elde bu sefer farkli bir guc merkezi olan para ile toplandigi donem olmasi tesaduf degildir.\r\n\r\n    todo: barter system vs money as layer of commerce mathematically reducing the comlexity.\r\n\r\n    #### Appendix\r\n\r\n    1. Fizik formulleri\r\n        - Fizik bilimi aslinda bizim icinde yasadigimiz gercekligin mekaniklerine dair imgelerimizdir. Formullerimizin icine ne kadar cok parametreyi dahil eder ve daha derine bakarsak gerceklige daha yakinsayan bir algi olustururuz.\r\n    2. Alteration illusion\r\n        - Elder Scrolls oyunundaki alteration ve illusion buyu ogretileri arasindaki fark aslinda bunun guzel bir ornegi\r\n    \r\n\r\n    3. matematik icat midir, yoksa kesif mi sorunsali. aslinda temelde kavramin imge mi olgu mu olduguna referans verir. Pratikte bir ciktisi oykmus gibi gorunse de, kavrama seklimiz ve dengemize dair bir goru sunar.\r\n\r\n    mimarlik btu, odtu karsilastirmasi. what seem to be architecture as visually. might not be appear as what architecture really as as a definer of space, relations, and cultuvator of culture.\r\n\r\n    ##\r\n\r\n    ---\r\n\r\n    [^1]: Deutsher Bundestag. _Federal Almanya Cumhuriyeti Anayasasi [Constitution of the Federal Republic of Germany]_. 2022. Accessed (30 Oct 2023) https://www.btg-bestellservice.de/pdf/80207000.pdf\r\n\r\n\r\n\r\n    Bu ornekler umuyorum ki bu iki kavram aaraasindaki farki aktarmak icin ikna edici olmustur. Yazinin yonunu biraz saptirarak daha subtle bir ornek olaarak aslinda yazinin asil temasi olan mimarliga donmek istiyorum.\r\n\r\n    ---\r\n\r\n    #### Sonuc\r\n\r\n    -   [Referans]:\r\n\r\n        -   gorme bicimleri\r\n        -   Iyiler kotudur kotuler vasat.\r\n\r\n            -   https://www.reddit.com/r/Turkey/comments/14oa9mw/t%C3%BCrk_insan%C4%B1n%C4%B1n_k%C3%B6t%C3%BC_kalpli_olmas%C4%B1/\r\n\r\n        -   altin neden degerli\r\n\r\n            -   https://eksiseyler.com/periyodik-cetveldeki-100den-fazla-element-arasinda-altin-neden-bu-kadar-degerli\r\n\r\n        -   sign and signifier\r\n            -   https://en.wikipedia.org/wiki/Signified_and_signifier\r\n\r\n    -
