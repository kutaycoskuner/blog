ot;:[0,&quot;İmge, Temsil ve Olgu&quot;],&quot;created&quot;:[3,&quot;2023-02-03T00:00:00.000Z&quot;],&quot;updated&quot;:[3,&quot;2026-09-22T00:00:00.000Z&quot;],&quot;revision&quot;:[0,1],&quot;language&quot;:[0,&quot;tr&quot;],&quot;visibility&quot;:[0,true],&quot;sort_order&quot;:[0,3]}],&quot;body&quot;:[0,&quot;## Notre Dame&#39;ın Kamburu\r\n\r\nKalabalığın yuhaladığı, iğrendiği, korktuğu ve okuyucunun pek de kolay kendini bağdaştıramayacağı bir karakter Quasimodo: Victor Hugo’nun önemli eserlerinden biri olan Notre Dame’ın Kamburu’nun başkarakteri. Bu yapıtla olan tanışıklığım, kitabı okumadan önce Disney’in yaptığı animasyon filmiyle gerçekleşmişti. Animasyon, orijinal eserden oldukça farklı olsa da, eserin üzerine kurulu olduğu değerleri yansıtıyor diyebiliriz. Kısaca hatırlatmak gerekirse, kitap Orta Çağ’da Paris’in ünlü Notre Dame Katedrali’nde çancılık yapan kambur Quasimodo’nun trajik hikâyesini anlatıyor. Bu yapıtı özel kılan ve kalıcı bir yer edinmesini sağlayan şey ise — ki elbette o zamanlar bunu bu şekilde ifade edemiyordum — beğeni kazanmış pek çok hikâyede gördüğümüz “seçilmiş kişi” kalıbının neredeyse tam bir antitezi olması.\r\n\r\nKlasik seçilmiş kişi hikâyelerinde, kaderi insanlığı kurtarmak olan bir ana karakter karşımıza çıkar. Zorluklarla mücadele eder ve karşısındaki düşmanı yenerek zafere ulaşır. Zaten çoğu zaman bu zafer, bir kader ya da önceden yazılmış bir yazgı aracılığıyla öngörülmüştür. Her şey plana uygun ilerlediğinde ise seyirci bir doyum hissine ulaşır. Popüler kültürden birkaç örnek vermek gerekirse, Star Wars’un Luke Skywalker’ı, Matrix’in Neo’su, Harry Potter ve Naruto; daha klasik örneklerde ise Theseus ve Kral Arthur, seçilmiş kişi hikâyelerine örnek olarak sunulabilir. [^1]\r\n\r\nQuasimodo’da ise tam tersini görüyoruz. Ana karakterimiz şanssız doğmuş, canavar gibi görünen, kaderinde dünyayı kurtarmak olmayan, ezilmiş ve hor görülmüş bir kambur. Nitekim hikâyesi de mutlu sonla bitemiyor. Fakat Quasimodo’nun görünüşü ile diğer insanların ona atfettiği özellikler hiç örtüşmüyor: O, olağanüstü kibar, kimsenin idrak edemediği derinliği ve sevgiyi anlayabilen, iyi niyetli bir karakter. Eseri tecrübe etmemiş okuyuculara daha fazla spoiler vermemek için burada kesiyorum. Animasyonu izlemenizi ve zaman ayırırsanız kitabını okumanızı şiddetle tavsiye ederim.\r\n\r\n\r\n&lt;p align=\&quot;center\&quot;&gt; \r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20250326-disney-hunchback-of-notre-dame-review-1996-1-780x470.png\&quot; /&gt; \r\n    &lt;br/&gt; \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figür 1.&lt;/sub&gt; \r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Quassimodo: Disney&#39;in Notre Dame&#39;ın Kamburu Animasyonundan bir kare. &lt;/sub&gt; \r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1996. &lt;/sub&gt; \r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://www.hollywoodintoto.com/wp-content/uploads/2021/07/disney-hunchback-of-notre-dame-review-1996-1-780x470.jpg&lt;/sub&gt; \r\n&lt;/p&gt;\r\n\r\nPeki, bu yapıt neden önemli? Notre Dame’ın Kamburu, aslında bilinçli olarak kurgulanmış bir şekilde sizi imge ile olgu arasındaki farkı derinlemesine sorgulamaya itiyor. Quasimodo’dan bireye genellersek: Bir kişinin karakteri ile dış görünüşü her zaman örtüşmeyebilir. Çok iyi ve düzgün görünen biri kötü niyetli olabilirken, korkunç görünen biri aslında çok iyi kalpli olabilir. Bir diğer deyişle, görüntü ile içerik bağdaşmayabilir.\r\n\r\nBu kavramları bir üst iterasyonda, daha kuramsal bir perspektiften ele alırsak: Doğadaki her nesne, olay veya düşünce (bu yazıda “olgu” olarak adlandırılacaktır), bizim ona dair algımız ve deneyimlerimiz doğrultusunda zihnimizde bir imge oluşturur. Dünyayı ve çevremizi bu imgeler üzerinden deneyimleriz. Olgu, bizim onu algılama ve yorumlama şeklimiz aracılığıyla imgeyi oluşturduğu için, bu iki kavram arasında önemli farklılıklar olabilir. Daha doğru bir ifadeyle, olguyu birebir kopyalayamayacağımızdan, her imge olguya dair bir referans veya gösterge olarak var olur. Bu durum, bu yazının ana önermesi olan şu ifadeyi gösterir: İmge ile olgu arasında doğrudan bir bağlantı olması şart değildir.\r\n\r\n\r\n**Literatürde İmge ve Olgu**  \r\n\r\n\r\nYazının ana konusu olan bu kavramlar arasındaki ilişki, farklı araştırmacı ve düşünürler tarafından farklı şekillerde yorumlanmıştır. Bu nedenle, öncelikle bir tanım setiyle başlamanın faydalı olacağını düşünüyorum.\r\n\r\n**Olgu**: Gerçeklikteki nesnenin kendisidir.\r\n\r\n**Temsil**: Gösteren veya gösterge, bir olgunun başka bir şey aracılığıyla ve belirli parametreler üzerinden gösterilmesi durumudur. Örneğin yazı, resim vb. Burada belki belirtmemiz gereken bir diğer nokta, temsilin genellikle gerçeklikten bağımsız ve kendisi de ayrı bir olgu olabileceğidir. Temsil ile olgu arasında doğrudan bir bağ olması zorunlu olmamakla beraber, genellikle olguya ait belirli parametreler üzerinden bir bağlantı kurulur.\r\n\r\nBunu oldukça somut bir örnekle açıklayacak olursak, bir satranç oyununu oynayan A ve B kişilerini ele alalım. Satranç tahtasında A kişisi beyaz, B kişisi ise siyah taşlarla oynasın. A kişisi ile onu temsil eden beyaz renk arasında herhangi bir bağıntı olmak zorunda değildir. Nitekim, herhalde her satranç oyuncusu farklı oyunlarda hem beyaz hem de siyah taşlarla oynamıştır. Burada beyaz taşlar, A kişisinin o oyundaki temsilidir; ancak beyaz renk ile A kişisi arasında zorunlu veya doğal bir ilişki yoktur.\r\n\r\n**İmge**: İmge ise olguya dair zihinde oluşan tezahürdür. İmge algısaldır ve değişiklik gösterebilir. Aynı olgu, farklı kişiler tarafından farklı şekillerde algılanabilir ve dolayısıyla farklı imgeler oluşturabilir.\r\n\r\nDaha çok felsefi ve linguistik bir tartışmanın konusu olan bu temaya birçok farklı yaklaşım dahil edilebilse de, konuyu benzer terminoloji ve problemler üzerinden ele alan iki kişiden bahsedebiliriz: Ferdinand Saussure [^2] ve Ludwig Wittgenstein. [^3]\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img40\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20250318-saussure_signified-signifiant.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figür 2.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Saussure, dilbilim alanında anlamın oluşumunu gösteren ve gösterilen kavramları üzerinden kuramsallaştırmıştır. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1916. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://upload.wikimedia.org/wikipedia/commons/d/d6/Saussure_Signifie-Signifiant.png&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nDüşünürler, belirtilen kavramlar arasındaki ilişkiyi birbirinden farklı şekillerde kurgularlar. Örneğin, olgudan temsile, temsilden imgeye hiyerarşik bir geçiş olduğunu iddia eden yaklaşımlar olduğu gibi, temsilin de başlı başına bir olgu, temsilin zihindeki karşılığının ise bir imge olduğunu savunan argümanlar vardır. Bu yazıda, daha karmaşık bir analiz gerektiren temsil kavramı, linguistik ve felsefi bir tartışmayı gerektirdiğinden içeriğin kısmen dışında bırakılmıştır. Bunun yerine, imge ve olgu gibi daha basit tanım kümeleri oluşturulabilecek kavramlara ve bunların gündelik hayatımızdaki izdüşümlerine odaklanılmıştır.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt; \r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20250318-Las_Meninas_(1656)_by_Velazquez.jpg\&quot; /&gt; \r\n    &lt;br/&gt; \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figür 3.&lt;/sub&gt; \r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt;Foucault, *The Order of Things* (1966) adlı eserinde Diego Velázquez’in *Las Meninas* (1656) tablosunu analiz ederek, görsel temsili geleneksel olarak yapılandıran hiyerarşik modellerin ve sınıflandırma sistemlerinin sorgulanması gerektiğini savunur. Tablo, yerleşik kategorileri pekiştirmek yerine, temsilin istikrarsızlığını ortaya koyar ve görsel bilginin düzenlenmesine ilişkin geleneksel yaklaşımlara bir eleştiri sunar.&lt;/sub&gt; \r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1966.&lt;/sub&gt; \r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://upload.wikimedia.org/wikipedia/commons/f/f8/Las_Meninas_%281656%29%2C_by_Velazquez.jpg&lt;/sub&gt; \r\n&lt;/p&gt;\r\n\r\nPeki, görece bariz görünen bu bilgi üzerine yazı yazılacak kadar önemli olan nedir? Kuramsal araştırmanın doğası gereği ortaya çıkan soyut bir bilgi gibi görünse de, imge ve olgu ayrımını yapabilmek ve bu iki kavram arasındaki ilişkinin türünü tanımlayabilmek, bize şaşırtıcı şekilde hem günlük hayatımızı hem de toplumsal ve çevresel açıdan daha adil ve ideal olanı inşa etme konusunda bazı düşünsel yapıtaşları sunabilir.\r\n\r\nPeki nasıl? Bu durumu açıklamak için ilk başta yüzen kavramların hatlarını, örnekler üzerinden biraz daha belirginleştirelim.\r\n\r\n## Disiplinler Bazında Örnekler\r\n\r\n**Bilgisayar Bilimi**\r\n\r\nİmge ve olgu arasındaki farkın dile getirilmesi, farklı disiplin ve bağlamlarda tekrar tekrar karşımıza çıkar. Örneğin, enformatik bilimi, bilgisayarlarda bilgiyi depolarken bunları her zaman aynı olan, açık veya kapalı bit birimleri ve bunların kombinasyonları şeklinde ifade eder. Bir bilgisayar bilimci, ifade edilen bilginin her zaman sembolik olduğunu bilir. Bu durum, nesne yönelimli programlamada da karşımıza çıkar.\r\n\r\nBilgisayar biliminde veri yapıları, bir bilgi modelinin ikilik (binary) düzende nasıl temsil edileceğini belirleyen bir kurgu olarak tanımlanabilir. Sayılar ve karakterler gibi temel veri tipleri, herkes için ortak olan ve standartlaştırılmış temsillere sahip daha basit yapı taşlarıdır. Buna karşılık, programın ihtiyaçlarına göre şekillenen daha karmaşık veri yapıları, verinin nasıl algılandığı ve nasıl işlenmek istendiği doğrultusunda tasarlanan soyut, kurgusal yapılardır.\r\n\r\nKonu hakkında bilgisi olmayan okuyucular için yazıyı teknik olarak bulanıklaştırmak istemiyorum. Fakat buna, sezgisel güzel bir örnek olduğunu düşündüğüm Craig Larman’ın Applying UML and Patterns kitabını verebilirim. Kitap, her ne kadar felsefi bir çıktıdan ziyade doğrudan işlevsel temsil mekanizmalarına odaklansa da, farklı temsil mekanizmalarının olasılığına ve bu olasılıkların yarattığı fırsat ve kısıtlamalara değinmektedir.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img40\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20260316-applying_uml_and_patterns-18779749133.jpg\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n\r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figür 4.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Craig Larman’ın Applying UML and Patterns kitabının kapağı. Aynı olgunun farklı şekillerde temsil edilebilmesi ve yorumlanabilmesi, farklı temsil biçimlerinin sunduğu olanakların önemini vurgular. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1997. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://m.media-amazon.com/images/I/71XTPbPx5jL._SL1500_.jpg&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\n\r\nBu kurgular, farklı programlama paradigmaları içerisinde farklı biçimlerde modellenebilir ve her tasarım kendi içinde belirli avantajlar ve dezavantajlar barındırır. Sonuç olarak, verinin temsil biçimi, aynı zamanda onun nasıl düşünüldüğünü ve hangi bağlamda anlam kazandığını da belirler. Bu durumda imge, temsil biçimini şekillendirir.\r\n\r\n\r\n**Matematik**\r\n\r\nBir başka bağlamda, belki de daha felsefi bir tartışma olan “matematik keşif midir yoksa icat mı?” sorusunu duymuş olabilirsiniz. Bu yazının amacı bu soruya bir yanıt aramak olmasa da, bu soru yazının ele aldığı konu bağlamında tartışılabilir. Nitekim soru, aynı zamanda matematiğin bir “imge” mi yoksa bir “olgu” mu olduğu şeklinde de sorulabilir.\r\n\r\nBu denemede bu soruya doğrudan bir cevap verme amacı güdülmemektedir. Bununla birlikte, konuya dair açıklayıcı bir örnek sunduğunu düşündüğüm için metne dahil edilmiştir. Olgu tekil ve benzersizken, imge çoğul olabilir ve farklı biçimlerde ortaya çıkabilir. Bu durum bize çeşitli avantajlar sağlarken, aynı zamanda bizi belirli bir düşünce biçimine kanalize ederek sınırlayabilir. Ancak bu sınırlamalar her zaman açık ve görünür değildir.\r\n\r\nMatematik bize, temsil mekanizmaları aracılığıyla gerçekliği soyutlayarak zihnimizde modelleyebilme olanağı sağlar. Örneğin François Viète ve René Descartes başta olmak üzere onlarca matematikçi, bugünkü cebirsel gösterimlerin gelişimine katkı sağlamıştır. 16. yüzyıldan önce ancak geometrik olarak ifade edilebilen denklemler zamanla yazınsal formata dökülebilmiş, bu notasyon ise zihinsel algı gereksinimini devre dışı bırakarak kavramları kâğıt üzerinde belirli kurallarla soyutlanabilir hâle getirmiştir. [^4] Bir zamanlar döneminin en yüksek seviyedeki matematikçilerinin uğraştığı denklemler, bu temsil mekanizmaları sayesinde bugün ortaokul-lise seviyesindeki öğrenciler tarafından çözülebilir olmuştur. Konuyla ilgili Veritasium kanalının hayali sayıların icadı üzerine güzel bir videosu var; izlemenizi tavsiye ederim. [^5]\r\n\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20260310-geo_alg_rep.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figür 5.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Veritasium’un *How Imaginary Numbers Were Invented* videosundan bir kesit. Geçmişte geometrik olarak ifade edilen matematiksel yapılar, zamanla cebirsel gösterimler aracılığıyla belirli kurallar içerisinde temsil edilebilir hâle gelmiştir. Bu farklı temsil biçimi, aynı matematiksel olgunun daha soyut ve sistematik bir şekilde ele alınabilmesini mümkün kılmıştır. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 2021. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://youtu.be/cUzklzVXJwo?t=183&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nBir başka örnekte, Mathematica sisteminin ve Wolfram Language’in geliştiricisi olan Stephen Wolfram, matematiğin bir yönüyle “icat” olarak ele alınabileceğini öne sürmektedir. Matematik, doğruluğundan şüphe edilmeyen aksiyomların üzerine, yine doğruluğundan şüphe edilmeyen mantıksal çıkarımlar ve bu çıkarımlardan türeyen yapılar aracılığıyla inşa edilir. Bu bakış açısına göre, matematiğin ortaya koyduğu sonuçlar yalnızca keşfedilen gerçeklikler değil, aynı zamanda seçtiğimiz başlangıç kabullerinin doğal sonuçlarıdır.\r\n\r\nWolfram’a göre, temel aldığımız aksiyom setlerini değiştirdiğimizde, aslında bambaşka matematiksel sistemler ve dolayısıyla bambaşka “matematiksel evrenler” inşa edebiliriz. Hangi yapıların var olabileceği, hangi problemlerin çözülebileceği ve hangi sonuçlara ulaşılabileceği, büyük ölçüde başlangıçta kabul ettiğimiz aksiyomlar tarafından belirlenir. Bu açıdan bakıldığında matematik, sabit ve tekil bir yapı olmaktan ziyade, farklı başlangıç kabulleri üzerinden inşa edilebilen sistemler bütünü olarak görülebilir. [^6] [^7] Wolfram’ın bu perspektifinden bakıldığında, matematik bir olgudan ziyade bir imge olarak şekillenir. \r\n\r\n&lt;div class=\&quot;quote-block\&quot;&gt; \r\n    &lt;div class=\&quot;quote-main\&quot;&gt; \r\n        What we observe is not nature itself, but nature exposed to our method of questioning.\r\n    &lt;/div&gt;\r\n        &lt;div class=\&quot;quote-main\&quot;&gt; \r\n        Gözlemlediğimiz şey doğanın kendisi değil, doğanın bizim sorgulama yöntemimize kendini gösterme biçimidir.\r\n    &lt;/div&gt;\r\n        &lt;div class=\&quot;quote-cite\&quot;&gt;\r\n        &lt;span class=\&quot;quote-author\&quot;&gt; Werner Heisenberg. &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-src hidden\&quot;&gt; &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-date\&quot;&gt; 1927. &lt;/span&gt;\r\n    &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n\r\n\r\n**Sanat** \r\n\r\nİmge, olgu ve temsil arasındaki ilişki, sanatçıların da yoğun olarak ele aldığı bir konudur. Bu ayrım, temsil mekanizmalarına yüklediğimiz kabulün gücünü gösteren iyi bir örnek sunar.\r\n\r\nRené Magritte’in çalışmaları bu bağlamda özellikle dikkat çekicidir. “Pipo” eserinde, aynı olguya dair farklı imgeler birbiriyle çelişir biçimde sunulur. Ancak burada önemli nokta, hem resmin hem de yazının yalnızca birer temsil olmasıdır. Pipoya dair resim de, yazı da olgunun kendisi değil; ona dair farklı temsil biçimleridir.\r\n\r\nProblem ise bireyin bu temsiller arasından hangisini “doğru” olarak benimsediği noktasında ortaya çıkar. Bu durumda bir trikotomi ile karşılaşırız: Yazı mı doğrudur, resim mi doğrudur, yoksa her ikisi de mi yanlıştır?\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img40\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20250318-magritte_pipe.jpg\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figür 6.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; René Magritte’in İmgelerin İhaneti adlı eseri. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1929. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://en.wikipedia.org/wiki/File:MagrittePipe.jpg&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nMagritte, bu meseleyi sanatı aracılığıyla bir tartışma alanı olarak ortaya koymuştur. Burada varılan nokta şudur: Seçtiğimiz imgeler, olguya ve gerçekliğe dair algımızı şekillendirir; bu algıların bütünü ise toplumumuzu, içinde bulunduğumuz yapılı çevreyi, dünya görüşümüzü ve dolayısıyla nasıl yaşadığımızı belirler. [^8]\r\n\r\nİmge ile olgu arasındaki ilişki, bir ya da birden fazla parametre üzerinden kurulabileceği gibi, hiçbir zorunlu bağa da dayanmayabilir. Yani imge ile olgu arasında doğrudan bir karşılık ilişkisi bulunması zorunlu değildir.\r\n\r\nBuradaki temel risk, imgenin bir manipülasyon ve kontrol aracı olarak kullanılabilmesidir. Çünkü imgeyi şekillendiren yapı, aynı zamanda düşünme biçimimizi de yönlendirebilir. Bu durum, bireyi var olmayan bir şeye inandırabilir, olasılık alanını daraltabilir ya da mevcut olmayan olasılıkların varlığına ikna edebilir.\r\n\r\nToplumsal düzeyde ise imgelerin kabulü, yalnızca bireysel algıyı değil; o topluluğun içinde bulunduğu yapılı çevrenin nasıl evrileceğini de belirler. Bu ayrımın kuramsal çıktılarına değinmeden önce, gündelik yaşamda imgenin gücüne dair daha somut örnekler üzerinden örneklerimizi genişletebiliriz.\r\n\r\n## İmgenin Gündelik Hayattaki İzdüşümleri\r\n\r\n**Reklamlar**\r\n\r\nReklam, genel kabul gören tanımıyla, bir ürünün, hizmetin veya etkinliğin tanıtımı ve teşviki amacıyla gerçekleştirilen iletişim faaliyetleridir. Neoliberal yapının domine ettiği günümüz dünyasında reklam, neredeyse herkesin sürekli maruz kaldığı yaygın bir olgu hâline gelmiştir.\r\n\r\nReklam üreticilerinin sıklıkla kullandığı tekniklerden biri, bireylerin düşünce yapıları içerisinde kendi deneyimleri ve duygularıyla ilişkilendirebilecekleri pozitif imgeler oluşturmaktır. Bu yöntemle ürün ya da hizmet, doğrudan özellikleri üzerinden değil, duygusal çağrışımlar ve kültürel imge setleri üzerinden anlamlandırılır. Böylece imge, algının kurucu bir bileşeni hâline gelir.\r\n\r\nBuna tarihsel olarak en bilinen örneklerden biri, De Beers’in 20. yüzyılın ortalarında, özellikle 1947 yılında başlattığı “A Diamond Is Forever” sloganıyla yürüttüğü kampanyadır. Bu kampanya, elmas ile “sonsuz aşk” kavramı arasında güçlü bir imgesel bağ kurarak elması yalnızca bir mücevher olmaktan çıkarıp evlilik ve bağlılık ritüelinin neredeyse zorunlu bir sembolüne dönüştürmüştür. Böylece ekonomik bir ürün, toplumsal bir norm ve duygusal bir zorunluluk gibi algılanmaya başlanmıştır.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20260308-de_beers_diamond.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figür 7.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; De Beers reklam filmi. Elmasın “sonsuz aşk” ve evlilikle özdeşleştirilmesini sağlayan reklam kampanyasının, bir ürünün toplumsal ve duygusal bir imgeye dönüştürülmesine dair erken örneklerinden biri. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1997. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://www.youtube.com/watch?v=8pU6WQXkiOU&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\n\r\nNadirliği ve sertliği nedeniyle bir zamanlar oldukça değerli taşlar arasında kabul edilen elmaslar, Sanayi Devrimi’nin getirdiği teknolojik ve ekonomik imkânlarla birlikte 19. yüzyılda (özellikle 1870’lerden itibaren Güney Afrika’da büyük elmas yataklarının keşfedilmesiyle) sanıldığı kadar da nadir olmadığının anlaşılmasıyla yeni bir üretim ve dağıtım sürecine girmiştir. 20. yüzyılda ise sentetik elmas üretiminin mümkün hâle gelmesiyle birlikte, aslında nadirlik temelinde değerlendirildiğinde büyük ölçüde “istisnai değer” iddiasını kaybetmiş bir materyal hâline gelmiştir. [^9]\r\n\r\nBuna rağmen elmas, değerini kaybetmek yerine daha da güçlenmiştir. Bunun temel nedeni, üretim ve dağıtımını kontrol eden yapıların, ekonomik tekelleşmenin yanı sıra başarılı bir imge yönetimi kurabilmiş olmalarıdır. Özellikle De Beers tarafından yürütülen reklam kampanyaları, elması yalnızca bir mineral olmaktan çıkarıp kültürel ve duygusal bir zorunluluk nesnesine dönüştürmüştür.\r\n\r\nBu süreçte elmasın “nadirliği”, aşkın nadirliği ile; “sertliği” ise aşkın ve bağlılığın sonsuzluğu ile analojik olarak ilişkilendirilmiştir. Bu bağlantılar doğrudan değil, dolaylı ve duygusal imgeler üzerinden kurulmuş; böylece elmas yüzük, özellikle evlilik ritüelinde, neredeyse evrensel bir norm hâline gelmiştir.\r\n\r\nSonuç olarak, günümüzde elmas ne gerçek anlamda nadir ne de özsel olarak benzersizdir. Ancak bu durum, onun toplumsal ve ekonomik değerini belirlemede belirleyici değildir. Asıl belirleyici olan, imgenin nasıl kurulduğu ve bu imgenin olguya dair algıyı nasıl şekillendirdiğidir. Bu da bizi önceki tartışmalara geri götürür: İmge ile olgu arasındaki ayrım, pratik dünyada çoğu zaman ikincil kalır; esas güç, imgenin üretim ve kabul mekanizmasında yatar.\r\n\r\n\r\n&lt;div class=\&quot;quote-block\&quot;&gt; \r\n    &lt;div class=\&quot;quote-main\&quot;&gt; \r\n        imagination rules the world.\r\n    &lt;/div&gt;\r\n    &lt;div class=\&quot;quote-main\&quot;&gt; \r\n        Dünyaya hükmeden hayal gücüdür.\r\n    &lt;/div&gt;\r\n        &lt;div class=\&quot;quote-cite\&quot;&gt;\r\n        &lt;span class=\&quot;quote-author\&quot;&gt; Napoléon Bonaparte &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-src\&quot;&gt; &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-date\&quot;&gt;  &lt;/span&gt;\r\n    &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n**Para**\r\n\r\nPara kavramı da güncel bağlamda imge ile olgu arasındaki farkın güçlü bir örneği olarak ele alınabilir. Değişim aracı olarak para, farklı değerlerle takas edilebilen ortak bir ölçüt olarak kurgulanmış, temelde ise toplumsal bir uzlaşıya dayanan yapay bir sistemdir. [^10] Bu özellikler, paranın fiziksel varlığından çok, onun temsil ettiği “değer imgesi”nin güvenilirliği ile ilgilidir. Yani para, kendi başına değeri olan bir nesne değil; değer kavramına dair ortak bir imgenin somutlaşmış hâlidir. Bu anlamda para, fiziksel bir nesneden ziyade kurgusal bir değer temsilidir. \r\n\r\nDahası, paranın kendisi zaten bir değer imgesiyken, zamanla bu imgenin taşıması beklenen temel özellikleri bile taşımaktan vazgeçerek ikinci bir soyutlama katmanına geçmiştir. Fiziksel bir obje olarak düşünüldüğünde, ortak bir ticaret aracında aranan bazı temel özellikler öne çıkar: dayanıklı olması, zaman içinde bozulmaması, zararlı olmaması (örneğin radyoaktif ya da kimyasal açıdan risk taşımaması), kolayca temin edilememesi ve en önemlisi sahteciliğe karşı dirençli olması. [^11] Altın, bu özellikleri büyük ölçüde taşıdığı için uzun yıllar boyunca uygun bir ticaret metası olarak kullanılmış; günümüzde ise yerini madeni para, banknot ve dijital para biçimlerine bırakmıştır. Ancak çeşitli sahteciliği önleyici süreçlerden geçirilse ve üretimi kontrollü şekilde yapılsa da, günümüz para sisteminin fiziksel karşılığı büyük ölçüde kâğıt ve düşük değerli metallerden oluşmaktadır — yani olgunun kendi özellikleri değil, olgu üzerine inşa edilmiş bir imgenin imgesi geçerlidir artık. Bu çıpasızlaşmanın tarihsel dönüm noktası 15 Ağustos 1971&#39;de yaşanmıştır: ABD Başkanı Richard Nixon, doların altına dönüştürülebilirliğini askıya alarak Bretton Woods sistemini fiilen sona erdirmiş, \&quot;geçici\&quot; olarak sunulan bu karar hiçbir zaman geri alınmamıştır. [^12] O andan itibaren dolar — ve onu izleyen diğer başlıca para birimleri — herhangi bir fiziksel metaya bağlı olmaktan çıkmış, tamamen güvene dayalı bir sisteme dönüşmüştür. Bu kopuş paranın, artık imgenin taşıması beklenen son fiziksel referanstan da arınarak salt bir güven ilişkisine indirgendiğinin resmi kabulüdür.\r\n\r\nBu imgeleşme çeşitliliğine dair bir başka çarpıcı örnek de kripto paralardır. Kripto paralar, klasik anlamda değeri kendinde tutan bir meta olarak değil, bireyler arası değer transferlerini değiştirilemez biçimde kaydeden dağıtık bir defter (ledger) sistemi olarak kuramsallaştırılmıştır. [^13] Nitekim iktisatçı Felix Martin, parayı tarih boyunca bir emtia değil \&quot;toplumsal olarak yaratılmış, devredilebilir bir kredi sistemi\&quot; olarak okumanın daha isabetli olduğunu savunur; [^14] bu çerçevede Bitcoin, değeri kendinde barındırmayan ama bir kayıt/uzlaşı ağı üzerinden değer üreten sistemlerin güncel bir uzantısı olarak görülebilir. Bitcoin&#39;in kendi teknik temelinde de bu okuma açıkça görülür: sistem, güvenilir bir üçüncü tarafa (bankaya) ihtiyaç duymadan, işlemlerin kriptografik olarak zincirlenmiş bir kayıt üzerinde doğrulanmasına dayanır — yani \&quot;değer\&quot; değil, \&quot;değerin devrine dair uzlaşılmış kayıt\&quot; esastır. Bu açıdan kripto para, imgenin fiziksel çıpadan koptuktan sonra ulaştığı en radikal noktayı temsil eder: artık ortada ne bir meta ne de bir banknot vardır, yalnızca dağıtık bir ağın üzerinde varlığını sürdüren, matematiksel olarak doğrulanmış bir güven kaydı vardır.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20260313-evolution_of_money1643723849304.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figür 8.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Takas Sisteminden Kripto Paraya: Paranın Evrimi. Ankur Sinha. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 2022. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://www.linkedin.com/pulse/from-barter-crypto-evolution-money-ankur-sinha/&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nDahası, farklı ülkelerin para birimleri arasında birimsel olarak büyük değer farklılıkları bulunması da bu göreliliği doğrular niteliktedir: para, mutlak ve evrensel bir değer olmaktan çok, toplumsal ve ekonomik uzlaşıya dayalı göreli bir sistemdir. Sonuç itibariyle paranın değerini yaratan şey, insanların o metaya dair zihinlerinde taşıdıkları ortak güven hissi, yani imgenin kendisidir. Ne var ki bu imge, olgunun kendisinden çok daha büyük bir soyut yapıyı gerçekliğe izdüşürür — tıpkı fiziksel bir gerçekliği açıklamak için dalga fonksiyonlarında gerçekte var olmayan karmaşık sayıları kullanmamız gibi.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img80\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20260310-money.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figür 9.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Paranın çeşitli biçimleri. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://p.turbosquid.com/ts-thumb/N4/nYWscS/GhlisZ8D/septimcoinsfinalrender5/png/1380723897/1920x1080/fit_q87/8b309a29550aee0c247f3424b9205b36c47f59d1/septimcoinsfinalrender5.jpg&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://www.ihath.com/wp-content/uploads/2019/04/money-2-1024x549.png&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;unknown&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\n\r\nPeki bir para biriminin veya para sisteminin değerli olduğuna kim, nasıl karar verir? Temelde bu durum, insanlar ve organizasyonlar tarafından sahip olunan politik ve ekonomik güç ile birlikte, belirli bir para biriminin \&quot;değerli\&quot; olduğuna dair oluşan ortak imge üzerinden şekillenir.\r\n\r\nBu gücün en somut göstergesi, uluslararası ticaretin ve rezervlerin hangi para birimi üzerinden yürütüldüğüdür. Örneğin dolar, II. Dünya Savaşı sonrası kurulan Bretton Woods düzeninden bu yana, salt ABD&#39;nin ekonomik büyüklüğünden değil, aynı zamanda askeri, siyasi ve kurumsal gücünün dünya çapında yarattığı \&quot;güvenilirlik imgesi\&quot;nden ötürü rezerv para statüsünü korumuştur.1 Bir ülkenin ordusu, diplomatik ağı, merkez bankasının bağımsızlığı algısı ya da hukuk sisteminin öngörülebilirliği — bunların hiçbiri parasal bir \&quot;olgu\&quot; değildir, ama hepsi o paraya duyulan ortak güvenin, yani imgenin, inşasına katkıda bulunur. [^15]\r\n\r\nBu imgenin kurumsallaşmış hali, kredi derecelendirme kuruluşlarında (Moody&#39;s, S&amp;P, Fitch) somutlaşır: bu kuruluşlar bir ülkenin ya da para biriminin \&quot;ne kadar güvenilir\&quot; olduğuna dair bir puanlama yaparak, aslında ölçülemeyen bir güven duygusunu ölçülebilir bir olguymuş gibi sunarlar. [^16] Ancak bu derecelendirmelerin kendisi de nihayetinde bir uzlaşıdan, yani piyasa aktörlerinin o kuruluşa duyduğu inançtan ibarettir — imgenin imgesi, bir kez daha.\r\n\r\nİmgenin ne denli kırılgan bir zemine oturduğunu gösteren en çarpıcı örneklerden biri de 1992&#39;de yaşanan \&quot;Kara Çarşamba\&quot; olayıdır: yatırımcı George Soros&#39;un önderliğindeki spekülatif hareket, İngiliz sterlini için piyasada oluşan güven imgesini birkaç saat içinde çökertmiş ve Birleşik Krallık&#39;ı Avrupa Döviz Kuru Mekanizması&#39;ndan çıkmaya zorlamıştır.3 Burada hiçbir fiziksel olgu değişmemiştir — ülkenin altın rezervi, üretim kapasitesi ya da nüfusu aynı kalmıştır — değişen yalnızca, milyonlarca aktörün zihninde o para birimine dair taşıdığı ortak güven imgesidir. [^17] Bu da göstermektedir ki parasal değer, büyük ölçüde tarihsel, siyasi ve toplumsal bir inşadır; olgudan çok, olgu üzerine inşa edilmiş kolektif bir inanç sistemidir.\r\n\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20260805-somali_hyperinfilation.jpg\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figür 10.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Somali&#39;deki hiperenflasyon, para biriminin değerini dramatik biçimde kaybetmesine neden oldu. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 2018. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://images.moneycontrol.com/static-mcnews/2018/09/Somali_5.jpg&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nBurada ortaya çıkan kabul, yani imgesel yapı, dikkatle tasarlanmış bir kâğıt parçasından ibaret olan fiziksel olgudan çok daha güçlü bir değer üretir. Böylece imge, somut nesnenin kendisinden bağımsızlaşarak, onun algılanan değerini belirleyen asıl faktöre dönüşür.\r\n\r\nKonuyu daha fazla dağıtmamak ve sizi yormamak adına, bu örneklerin ana fikri aktarmak için yeterli olduğunu düşünerek burada sonlandırıyorum. Ancak ilginizi çektiyse, imge ve olgu ilişkisinin ele alındığı dikkat çekici birkaç örneği yazının sonunda bulabilirsiniz.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20260313-sx4zpHI0-600x338.jpg\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n    &lt;sub class=\&quot;sub-num\&quot;&gt;Figür 11.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Prestige filminde Alfred Borden&#39;ın &#39;Kuş Numarası&#39;. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 2006. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://whatculture.com/film/10-even-more-movies-with-ridiculously-subtle-foreshadowing?page=9&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\n\r\n\r\n&lt;div class=\&quot;quote-block\&quot;&gt; \r\n    &lt;div class=\&quot;quote-main\&quot;&gt; \r\n        The secret impresses no one. The trick you use it for is everything.\r\n    &lt;/div&gt;\r\n    &lt;div class=\&quot;quote-main\&quot;&gt; \r\n        Sır kimseyi etkilemez. Onu kullandığın numara her şeydir.\r\n    &lt;/div&gt;\r\n    &lt;div class=\&quot;quote-cite\&quot;&gt;\r\n        &lt;span class=\&quot;quote-author\&quot;&gt; Alfred Borden. &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-src\&quot;&gt; Prestige. &lt;/span&gt;\r\n        &lt;span class=\&quot;quote-date\&quot;&gt; 2006. &lt;/span&gt;\r\n    &lt;/div&gt;\r\n&lt;/div&gt;\r\n\r\n\r\n## Imgenin yapili cevre ve toplumu sekillendirmesi\r\n\r\nBu noktaya kadar ele alınan örnekler, imgenin yalnızca soyut bir kavram olmadığını; aksine ekonomik, toplumsal ve kültürel yapıları doğrudan şekillendiren aktif bir unsur olduğu konusunda siz okuyucuyu kismen ikna edebildigimi umuyorum. \r\n\r\nAsıl konuya geri dönecek olursak, varoluştaki olgulara dair yarattığımız imgeler, bireysel algımızı şekillendirir. Bu algıların zamanla ortaklaşması ve genişlemesi (yani kabullerimiz), içinde yaşadığımız toplum, yapılı çevre ve genel dünya tasavvurumuzun nasıl kurulacağını belirler.\r\n\r\nBununla birlikte, imge ile olgu arasındaki ilişkinin zorunlu olmaması, imgelerin ve dolayısıyla onların ürettiği gerçeklik algısının manipüle edilmesine ve kontrol edilmesine de imkân tanır. Bu durumun bir örneğinini, carpici oldugunu ve ogrenimini gordugum mimarlık eğitimim boyunca Quasimodo üzerinden ele alınan ve farklı bağlamlarda tekrar eden bir ornek olay üzerinden açıklamak istiyorum. \r\n\r\nHer canlı, içinde doğduğu ve yaşadığı çevreyi bir şekilde kullanır; ancak bazı türler bu çevreyi, kendi yaşam koşullarını daha ideal hale getirmek amacıyla yeniden şekillendirir. Bunu, bir örümceğin ağ örmesi ya da bir kuşun yuva yapması gibi örneklerle açıklayabiliriz.\r\n\r\nİnsan ise, sahip olduğu organizasyonel karmaşıklık ve bilişsel kapasite sayesinde, bu çevresel dönüşümü bildiğimiz canlılar arasında en büyük ölçekte ve en yüksek etkiyle gerçekleştirebilen varlıktır.\r\n\r\nBu eylemi insan toplumlarında gerçekleştiren aktörlerden biri mimardır. Mimar, yapılı çevredeki dönüşümü; kullanıcı beklentileri, doğal çevreye etkiler, ışık, hava ve su kontrolü, toplumsal fayda, ulaşım, estetik, yaratıcılık, organizasyonel düzenleme, ekonomik etkiler ve sosyal ve politik ciktilar gibi hem doğrudan gözlemlenebilir hem de kimi zaman varsayımsal birçok parametreyi göz önünde bulundurarak yönetir.\r\n\r\nBu çok katmanlı değerlendirme süreci içerisinde amaç, gerçekleştirilen değişimin olası faydasını maksimize etmektir.\r\n\r\nModern ve kurumsallaşmış eğitimde kabul gören düşünceyi kabaca ifade edersek, mimarın bir rol olarak meşruiyeti; yalnızca bir yapıyı veya yapılı çevreyi tasarlayabilmesinden değil, bu tasarımın yaratacağı etkileri bütüncül bir şekilde öngörebilmesi ve buna dair gerekçeler üretebilmesinden gelir. Yani mimar, gerçekleştireceği müdahaleye ilişkin nedenler sunabilen kişidir.\r\n\r\nBu nedenle hem mimarlık eğitiminde hem de yapılı çevre üretiminde, bir yapı çoğu zaman somut bileşenlerinin (duvar, kolon, beton, pencere vb.) ötesinde, daha soyut kavramlar ve nitelikler üzerinden tanımlanır. Özgürlük, geçirgenlik, sürdürülebilirlik, yenilik gibi kavramlar neredeyse her tasarımın söylemsel temelini oluşturur.\r\n\r\nBu yaklaşımda tasarım, fiziksel nesnelerin doğrudan üretiminden ziyade, kavramsal bir zeminde kurulur; yapı, bu kavramsal çerçeve üzerinden gerekçelendirilir. Sonuçta ise, başlangıçta ortaya konan kavramların mekânsal ve deneyimsel olarak mimari üzerinde temsil edilmesi ve yaşantıya dönüşmesi beklenir.\r\n\r\nBöylece, nedenselliği kuran kavramlar kümesi ile üretilen mimarlık arasında bir olgu–temsil–imge ilişkisi ortaya çıkar.\r\n\r\nKlasik bir ornek olarak, genelde mimarlik egitimi almamis olan kisiler arasinda barok saraylar ya da postmodern organik mimari alisilagelmisten olan farkliligi nedeniyle iyi mimari olarak siniflandirilir. Siradisiligi ve bir biblo gibi goze hitap eden bir varolus sergilemesi bu sonuca varilmasindaki en buyuk girdi olarak nitelendirilebilir. Bu mimarinin bizim zihnimizde olusturdugumuz imge ve vardigimiz yargiyi olusturur. Fakat mimarlik sadece ilginc bir formu yaratmaktan fazlasiyla mukelleftir. Bastaki tanima donecek olursak, mimari yapili cevrenin canlinin cikarlari dogrultusunda degistirilmesi, ve sonuc olarak hayati duzenleme fonksiyonu oldugundan kacinilmaz olarak politiktir. Burada siradisilik ve formal yaraticilik mimari kaliteyi tanimlamak icin yetersiz kalir. Bu durumu daha derinden incelemek gerekir. Zihinsel imgeden, temsile ve temsil edilen olgulara ulasirsak ancak mimariyi dogru olarak yorumlayabiliriz. \r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img60\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20250320-duck_and_decorated_shed.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n        &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 13.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Robert Venturi, Denise Scott Brown, and Steven Izenour, through architectural examples in *Learning from Las Vegas*, reject the modernist idea that image and reality should remain consistent with one another. Their analysis of how the image can precede and shape perception became one of the foundations of postmodern architectural theory. *Duck and decorated shed*, Robert Venturi, Denise Scott Brown, and Steven Izenour, 1972. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; 1972. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://99percentinvisible.org/wp-content/uploads/2016/08/duckandds.png&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\n\r\nOrnegin bir saray, otoriteye ait bir yapidir. Otorite sarayi yaptirirken mekansal ihtiyactan ziyade, gosterisi onceliklendiriyorsa, buradaki kaygi daha cok gucun elestririden ziyade saygi gordugu bir toplumda guc gosterisi yapma amaci tasir. Paralel olarak, durumun ekonomik ve emek maliyeti, insanlarin hayat kalitesinden ziyade, guclunun gucunu muhafaza etme gayesine kayar. Sonuc itibariyle, sarayin temsil ettigi olgu asil yapili cevrenin butuncul fayda gayesinden kayearak, bireysel fayda gayesi uzerinde sekillenir. Yani mimarinin temsili, otoritenin gucunu yansitmaktir. Bu olgu otorasiye yakinsar. Despot bir yonetimin, gucunu yansitmaya calistigi yapi, imgeden olguya dogru bakmaya basladiginizda acinasi gorunur. Eger siz bu toplumun bir parcasiysaniz, o sarayin varligi sizin hayat kalitenizi arttirmaz, aksine hayat kalitenizin dusmesinin sebebi olarak varolur. \r\n\r\nBugun her ne kadar eskinin saraylari olmasa veya azalmis olsalar bile, aslinda ayni fonksiyonu ustlenen farkli yapilar gorebiliriz. Neoliberal sistemin tahakkum kurdugu gunumuz ideolojik yapisinda, starchitectler oduller ile pohpohlanan iyi mimarlik olarak otoritelerce etiketlenen un kazanmis &#39;deha&#39; mimarlar olarak karsimiza cikar. Bu mimarlarin yapilarini inceledigimizde ise, gorecegimiz sey gercek anlamda, bir yasami tasarlayan bireylerden ziyade, varolduklari toplumda gorulmemis bir seyi sunarak, ben merkezci bir bicimde, etkici olma cabasindaki yapilar goruuruz. Bu teknolojik imkanlarin elvermesiyle beraber, eski sosyal yapilarin degismesinin bir sonucudur. Fakat, mimarinin ne olduguna soyut anlamda baktigimizda yapilan eskinin saraylari ile asagi yukari ayni, fonksiyonel olma veya yeni bir toplumsal yapi sunma, islevsellikten ziyade etkileyici olma gayesi goz onune carpar. Neoliberal donemin iyi olarak sunulan mimarligi, aslinda orta cagin barok saraylarindan cok da farkli degildir. Benzer sekilde, gunumuzde bir zamanlar kazanilmis sosyal haklarin erozyona ugramasi, toplumsal refah dagiliminin, fransiz devriminden daha beter noktalara gerilemis olma durumu da bu onermeyi destekler. Neoliberal dusunce yapisi, eski duzeni, yeni formlarla yeniden kurgulamistir. Bu perspektifte, yaratilan mimari neoliberal dunyanin saraylaridir.\r\n\r\n&lt;p align=\&quot;center\&quot;&gt;\r\n    &lt;img class=\&quot;img100\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20260805-baroque_and_postmodern.png\&quot; /&gt;\r\n    &lt;br/&gt;   \r\n        &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 14.&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-desc\&quot;&gt; Left: Grand Staircase of Augustusburg Castle, Brühl (c. 1740s), within the castle complex built between 1725 and 1768. Right: Guggenheim Museum Bilbao (1997), designed by Frank Gehry. Although separated by nearly three centuries, both buildings can be interpreted as architectures of representation rather than necessity. The Baroque palace materializes the authority of the absolutist state through spectacle, while the Guggenheim exemplifies the contemporary neoliberal pursuit of iconicity and symbolic capital. Despite their formal differences, both prioritize the communication of power and prestige over functionality or social progression, suggesting that architecture continues to function as a medium through which dominant social orders legitimize themselves. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-year\&quot;&gt; n.d. &lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://kulturkenner.de/en/artikel/schloss-augustusburg-und-falkenlust-bruhl--2&lt;/sub&gt;\r\n    &lt;sub class=\&quot;sub-src\&quot;&gt;https://www.re-thinkingthefuture.com/wp-content/uploads/2020/09/A1755-10-Famous-examples-of-Post-Modern-Architecture.jpg?w=999&lt;/sub&gt;\r\n&lt;/p&gt;\r\n\r\nYapili cevre politik oldugu icin ayni zamanda, icinde bulundugu toplumun algi ve kabullerinin bir eseridir. Bizim uzerinde yasadigimiz imgeler manipule edilmemize manipule edilmemiz de baskalarinin bizi kontrol edebilmesine yol acar. Dolayisiyla, imge ve algi arasindaki bagimsizligin ayrimini yapabilmek onemlidir. \r\n\r\nKonudan sapmadan geri donecek olursak, yasadiginiz mekanlarda gordugunuz ve sadece farkliligi ve ilgincligi uzerinden degerlendiridiginiz mimari ve mekanlar aslinda o mekanlara dair imgedir. Daha derin bir okuma yaparak olgunun ne oldugu anlamak, mimariyi daha derinden incelemeyi ve okumayi gerektirir. Bu da onu yaratan ve politikadan bagimsiz olmayan prensipere baglidir.\r\n\r\nMimarligin sadece gorunum veya keyifli gorunen mekanlarla ilgili degildir. Mimarlik kacilnilmaz olarak politiktir [^12] toplumun kullanacagi mekanlari politikalar, ihtiyaclar, sosyoloji, ekonomi, teknoloji, temel bilimler, geometri, matematik ve sanatsal yaraticilik ile sekillendiren icine sinirsiz faktor ve parametrenin dahil edilebilecegi ve sonunda toplumun yasayis seklini belirleyen / degistiren cok boyutlu bir kavramdir. Mevcut otoritenin takdirinde, guc verilerek olusturulan mekanlari ureten kimselerin olusturdugu mekanlar mimarligin yoksunlugunu degil, o mekanlari yaratan ve kullanan toplumun carpikligini gosterir. Bunu bir baska ve daha temiz bir ornekle aciklayacak olursak kral, kralin gerekliligine ikna olmus olan insanlarin kolektif bilinciyle varolur. Olgu ile imgenin farkina ait farkindalik, bizim elestirel dusunceyi tetikler.\r\n\r\n## Conclusion\r\n\r\nSonuç olarak, imge ile olgu arasındaki ayrımı kavramak, yalnızca bir algılama farkını anlamaktan ibaret değildir; aynı zamanda gerçekliği nasıl kurduğumuzu ve ona nasıl yaklaştığımızı sorgulamanın başlangıç noktasıdır. [^13]Algıladığımız dünya, her zaman doğrudan ve nesnel bir gerçekliğin yansıması değildir; kültürel, toplumsal ve zihinsel süreçler aracılığıyla anlamlandırılmış bir gerçekliktir.\r\n\r\nBu farkındalık, eleştirel düşüncenin temelini oluşturur. Çünkü ancak gördüğümüz ile gerçekten var olan arasındaki mesafeyi fark ettiğimizde, içinde bulunduğumuz koşulları sorgulayabilir, görünür olanın ardındaki ilişkileri okuyabilir ve alternatif olasılıkları düşünebiliriz. Böylece gerçekliği değişmez bir durum olarak kabul etmek yerine, tarihsel ve toplumsal olarak şekillenmiş bir yapı olarak değerlendirebiliriz.\r\n\r\nErnst Bloch’un ifade ettiği gibi: **“En trajik kayıp, güven duygusunu yitirmek değildir; asıl trajedi, dünyanın başka türlü olabileceğini düşleyebilme yetisini kaybetmektir.”** Gerçekliğin kurgusal ve değişebilir yönünü kavramak, yalnızca mevcut olanı eleştirmemizi değil, henüz var olmayanı hayal edebilmemizi de mümkün kılar.\r\n\r\nBu nedenle eleştirel düşünce, yalnızca yanlışları tespit etme aracı değil; yeni ihtimalleri görebilme ve onları gerçekleştirebilme kapasitesidir. İmge ile olgu arasındaki ayrımı fark etmekle başlayan bu süreç, bireyin kendi algılarını, arzularını ve içinde yaşadığı dünyayı yeniden değerlendirebilmesine olanak sağlar. Sonuçta özgürleşme, yalnızca mevcut gerçekliği anlamaktan değil, onun farklı biçimlerde var olabileceğini hayal edebilmekten geçer.\r\n\r\n\r\n###\r\n\r\n    [^1]: “Kötüler Sofistikedir, İyiler Vasat.” _eray_ [_fabilog.com_]. 2016. Accessed (17 Mar 2026) https://web.archive.org/web/20161119041938/http://fabilog.com/kotuler-sofistikedir-iyiler-vasat/\r\n\r\n    [^2]: SAUSSURE, Ferdinand de. _Course in General Linguistics_. _Duckworth_. 1983. Original work published in 1916.\r\n\r\n    [^3]: WITTGENSTEIN, Ludwig. _Tractatus Logico-Philosophicus_. _Routledge_. 2001. Original work published in 1921.\r\n\r\n    [^4]: KHAN, Sal. “Descartes and Cartesian Coordinates” [Video File]. Uploaded by _Khan Academy_ [_youtube.com_]. 2012. Accessed (12 Aug 2026) https://www.youtube.com/watch?v=N4nrdf0yYfM\r\n\r\n    [^5]: “How Imaginary Numbers Were Invented” [Video File]. Uploaded by _Veritasium_, [_youtube.com_]. 2021. Accessed (12 Aug 2026) https://www.youtube.com/watch?v=cUzklzVXJwo\r\n\r\n    [^6]: WOLFRAM, Stephen. \&quot;Stephen Wolfram - Is Mathematics Invented or Discovered\&quot; [Video File]. Uploaded by _Closer to Truth_, [_youtube.com_]. 2016. Accessed (12 Aug 2026) https://www.youtube.com/watch?v=nUCwtLTUPQ4\r\n\r\n    [^7]: BAKIRCI, Çağrı Mert. “Matematik Bir Keşif mi, Yoksa İcat mı?”. _Evrim Ağacı_. 2019. Accessed (12 Aug 2026) https://evrimagaci.org/matematik-bir-kesif-mi-yoksa-icat-mi-8094\r\n\r\n    [^8]: FOUCAULT, Michel. _This Is Not a Pipe_. 1968. Accessed (12 Aug 2026) https://monoskop.org/images/9/99/Foucault_Michel_This_Is_Not_a_Pipe.pdf\r\n\r\n    [^9]: “Diamonds are a Scam -(De Beers Monopoly and Cartel, Genius Marketing, Blood Diamonds, Lab Diamonds)” [Video File]. Uploaded by _Alive &amp; Curious_, [_youtube.com_]. 25 May 2024. Accessed (12 Aug 2026) https://www.youtube.com/watch?v=DInpiaXjD1E\r\n\r\n    [^10]: KHAN, Sal. “Functions of money | Financial sector | AP Macroeconomics” [Video File]. Uploaded by _Khan Academy_, [_youtube.com_]. 21 Jun 2016. Accessed (12 Aug 2026) https://www.youtube.com/watch?v=ok2vtKnSZzY\r\n\r\n    [^11]: “Periyodik Cetveldeki 100&#39;den Fazla Element Arasında Altın Neden Bu Kadar Değerli?”. _crazycells [eksisozluk.com]_. 30 Mar 2017. Accessed (12 Aug 2026) https://eksiseyler.com/periyodik-cetveldeki-100den-fazla-element-arasinda-altin-neden-bu-kadar-degerli\r\n\r\n    [^12]: \&quot;Nixon Shock\&quot;. In _Wikipedia_. n.d. Accessed (22 Sep 2026) https://en.wikipedia.org/wiki/Nixon_shock\r\n\r\n    [^13]: NAKAMOTO, Satoshi. _Bitcoin: A Peer-to-Peer Electronic Cash System_. 2008. Accessed (22 Sep 2026) https://bitcoin.org/bitcoin.pdf\r\n\r\n    [^14]: MARTIN, Felix. _Money: The Unauthorised Biography_. London: The Bodley Head. 2013.\r\n\r\n    [^15]: EICHENGREEN, Barry. _Exorbitant Privilege: The Rise and Fall of the Dollar_. New York: Oxford University Press. 2011.\r\n\r\n    [^16]: SINCLAIR, Timothy J. _The New Masters of Capital: American Bond Rating Agencies and the Politics of Creditworthiness_. Ithaca: Cornell University Press. 2005.\r\n\r\n    [^17]: \&quot;Black Wednesday\&quot;. In _Wikipedia_. n.d. Accessed (22 Sep 2026) https://en.wikipedia.org/wiki/Black_Wednesday\r\n\r\n    [^--]: SARGIN, Güven Arif. “Demokrasi ve Mimarlık: Beden, Mekân, Siyaset II.” _Gas Mekan_. 2015. Accessed (12 Aug 2026) https://gasmekan.wordpress.com/2015/07/19/demokrasi-ve-mimarlik-beden-mekan-siyaset-ii/\r\n\r\n    [^--]: “John Berger / Ways of Seeing , Episode 1 (1972)” [Video File]. Uploaded by _Enlight Studies [youtube.com]_. 27 Jul 2020. Accessed (12 Aug 2026) https://www.youtube.com/watch?v=P-4LwAuTw7k\r\n\r\n\r\n\r\n&gt;   **Appendix**\r\n&gt;   \r\n&gt;   1. Examples of the problematic of image and phenomenon: Philosophical debate and cinema:\r\n&gt;       - One of the questions considered by twentieth-century philosophers is whether images merely represent reality or actively shape it. This question is also explored in popular culture, most notably in the 1990s film The Matrix.\r\n&gt;   \r\n&gt;   2. Examples of the problematic of image and phenomenon: Physics\r\n&gt;       - Physics can be understood as a set of model (representations) of the mechanics of the reality we inhabit. The more parameters we incorporate into our formulas and the deeper we look into the phenomena they describe, the closer our representation comes to reality.\r\n&gt;       \r\n&gt;   3. Examples of the problematic of image and phenomenon: The Elder Scrolls — Alteration and Illusion\r\n&gt;       - In the game universe of The Elder Scrolls, the distinction between the Alteration and Illusion schools of magic offers a useful example of the relationship between image and phenomenon. Alteration acts upon the underlying conditions of reality, whereas Illusion changes how reality is perceived by the observer. The distinction can therefore be understood as one between changing the phenomenon itself and changing the image through which the phenomenon is experienced.\r\n&gt;       \r\n&gt;   4. Examples of the problematic of image and phenomenon: Numerical Representation Systems and Rationalization\r\n&gt;       - Statistics, school grades, rankings, and almost anything we attempt to rationalize by reducing it to numbers can be understood as part of this problem. **Numerical representation systems** are created to represent aspects of reality in a structured and measurable form. Once such a representation becomes closely associated with the reality it describes, however, imperfections and gaps in the system can be identified and exploited. This creates a particularly interesting relationship between representation and reality: **once the representation becomes a system that governs reality, manipulating the representation can become a way of manipulating reality itself**.\r\n&gt;       - This is also a useful way of thinking about corruption. When institutional decisions are mediated through numerical and formal systems—grades, statistics, rankings, scores, qualifications, or other measurable indicators—the representation can become more important than the phenomenon it was originally intended to describe. Exploiting weaknesses in the representation can therefore produce real-world effects.\r\n&gt;       - This topic deserves a more detailed treatment, particularly in relation to note-taking systems, publishing, grading, and the quantification of knowledge, so it has been reserved for a separate essay.\r\n\r\n\r\n&lt;div class=\&quot;hidden\&quot;&gt;\r\n    ### conclusion\r\n    Toplayacak olursak, bu yazinin ana onermesi Imge, algi ve olgunun arasinda dogrudan bir baglanti olmak zorunda degildir. Bu fark basit ve temel bir gerceklik gibi gorunse de, gundelik hayatimizda siklikla unutup gormezden geldigimiz bir durumdur ve her ne kadar onemsiz gibi gorunse de aslinda pragmatik acidan da karsilastigimiz durum ve olaylara bakisimizda elestirel dusunceyi gelistirmemize, kendimize bir savunma mekanizmasi olusturmamiza, ve karsilastigimiz durumlara, olaylara daha derinlemesine bakarak alt-metin okumalari yapabilmemize olanak saglar (gorme bicimleri referansi). Bizi manipule edilmekten korur ve daha yuksek bir bilince ve kendimizi ve isteklerimizi sekillendirebilmemize yardimci olur kisacasi bizi ozgurlestirir. \r\n\r\n    Yasadigimiz hayat zihnimizde olusturdugumuz kurgularin bir eseridir, yasadigimiz kultur, toplumsal yapi, enstituler ve normal kabul ettigimiz seylerin hepsi kurgulsaldir. Bu kurgusalligin farkina varmak, bize yeni olasiliklarin farkindaligini kazandirir, su an varolmasa da daha iyiyi tasarlayabilmemize ve yasabilmemize yardimci olabilir.\r\n\r\n    bunun farkina varmak bize yeni Ernst bloch der ki \&quot;En trajik kayıp, güven duygusunu yitirmek değildir; asıl trajedi, dünyanın başka türlü olabileceğini düşleyebilme yetisini kaybetmektir\&quot;.\r\n\r\n    Icinde bulundguumuz dunyada, alistigimiz normal ve olagan kabul ettigimiz seylerin, aslinda daha farkli olabilecegini algilamak, ancak icinde bulundugumuz kosullara daha buyuk olcekten ve farkli bir gozle bakmayi gerektirir, bunu basarabilmek icin elestirel dusunce ise icinde bulundugumuz algisal gercekligin kabugunu kirabilmemizin yenane yoludur, fakat bu da farkli bir yazinin konusu olsun.\r\n\r\n\r\n    Ayni fizik formullerinde oldugu gibi, bizim gerceklgiin nasil isledigine dair yaptigimiz formul seklinde ifade edilen tezahurlar, ona dair\r\n\r\n    imge olgu farki -&gt; elestirel dusunce -&gt; bize yasadigimiz yapinin kurgusal oldugunu belirtir -&gt; daha iyi ve guzeli yaratmak elimizdedir fakat bunun icin elestirel dusunup ... kosullar.\r\n\r\n    &lt;p align=\&quot;center\&quot;&gt;\r\n        &lt;img class=\&quot;img60\&quot; src=\&quot;https://media.archrium.net/images/blog/20230203-imge_ve_olgu/20260313-Villa-Savoye-Le-Corbusier-1920x1280.jpg\&quot; /&gt;\r\n        &lt;br/&gt;   \r\n        &lt;sub class=\&quot;sub-num\&quot;&gt;Figure 12.&lt;/sub&gt;\r\n        &lt;sub class=\&quot;sub-desc\&quot;&gt; Villa Savoye by Le Corbusier. &lt;/sub&gt;\r\n        &lt;sub class=\&quot;sub-year\&quot;&gt; 1931. &lt;/sub&gt;\r\n        &lt;sub class=\&quot;sub-src\&quot;&gt;https://en.wikiarquitectura.com/building/villa-savoye/&lt;/sub&gt;\r\n    &lt;/p&gt;\r\n\r\n    Yukarida gormus oldugunuz gorsel, modern mimari kuramini elle tutulur prensiler uzerine kurgulayan Le Corbusier, b\r\n\r\n    ### discarded\r\n\r\n    Secilmis kisi hikayelerinde gordugum mantiksal problemi bir yana birakarak bu yazida ... Notre dame in kamburu hikayesini asiri sevmeme neden olan ve sonralardan bu sablondan duydugum rahatsizligi ancak yillar sonra kendime ifade edebilmistim. Hikaye beni rahatsiz eden yapiyi cok daha sonralardan kendime izah edebildim ki bunu bu yazinin odagini saptirmamak icin baska bir yaziya sakliyorum. Ama kabaca, secilmis kisi hikayelerinde ana karakterimiz, guclu, sansli, dogrudan vurgulanmasa da genelde yakisikli/guzel/karizmatik ve kaderi dunyayi kurtarmak olan kisidir.\r\n\r\n    ----------\r\n\r\n    Dunya uzerinde dusunce yapisinin kirilip epistemin degistigi her donem, varolan ve genel tarafindan kabul edilen dusunce sekline bir takim radikal degisimler getirmistir. Bu degisimler her zaman pozitif veya progresif olmamakla beraber, insanlarin yasam tarzina, sanata ve mekanlara izdusumler birakiyor ve sonucta bizim tarihsel donemleri birbirinden ayirma seklimizi belirledigini dusunuyorum. Ornegin rönesans doneminde insanlarin odagi dini varolusun vaadattigi noktadan yasadigimiz dunyaya kaymis ve bu durum katolik hristiyan otoritelerin toplum ustundeki guclerinin zayiflamasina neden olmustur. Nitekim takip eden barok doneminde, otoritenin lokal militer gucu elinde tutan asiller tarafindan yeniden ele alinip mesruiyetlerinin kabul edildigini ve sahip olduklari gucleri mekanlardaki eksessiv ornamentasyon ile disa vurduklarini gozlemleyebiliriz. Bu degisimlerin bir boyunuda, adeta bir sarkac salinimi gibi, otoritenin guc kazanip kaybettigini gorebiliriz. Nitekim, modern donem ve onu takip eden ayni zamanda su anda icinde yasadigimiz postmodern donemde de benzer patternleri gormenin mumkun oldugunu dusunuyorum.\r\n\r\n    Modern donem, kabaca toplumsal adalet ve gelisim talebinin, bilimin dogru kaaynak olaraak kabul edildigi bir epistemi benimsemisti. Bunu toplum icin yaratilan mekanlara aktarirken olusturacak formal dili bulmaya calisirken ise adeta baroku kendisine bir antitez olarak secmistir. Le Corbusier in dile getirdigi ve genel olarak kabul goren bu ilkelerden ikisi, ornamentasyondan arinma ve mimari cephe kavramina bir krsi durus olarak uniform bir dengeyi benimseme seklinde manifeste edilmistir. Genel tarih ve hatta buna temel bilimleri de ekleyebilriiz, bize neyin oldugunu ogretirken neden oldugu pek ifde edilmiyor.\r\n\r\n    Bu formal prensiplerin arkasinda elbette ki modern dusuncenin temelini olusturan daha ve daha adil bir toplumu amaclayan sosyalsit anlayis vardi. Buna dair getirilen yorumlardan biri, ornamentasyon reddedildi, cunku fonksiyonu hayata dogrudan bir deger katmaktan ziyade gucu temsil edisiydi, otoritenin kendini gosteris araciydi Ayrica finansal acidan maliyetleri arttirdigi icin erisiminin genele yayilmasi zordu. Nitekim cephe de benzer bir sebepten reddedildi, ayni ornamentasyonu gibi cephe, bir gosteris ogesi olarak, butunu temsil etmiyor, yapida gerceklikle bagdasmayan bir algi yaratmayi amacliyordu. Ayni reklam durumunuda oldugu gibi, bilincli olarak etik disi denilebilecek bir sekilde, gerceklikle bagdasmayan bir iluzyon yaratmayi amaclamistir. Nitekim modern donemin sona ermesine takriben, postmodern donemin kultleri arasinda kabul edilen ... in kitabinda cephe kavrami savunulan bir oge olarak yeniden yerini almistir. Cephe kavrami sadece bir yapinin geometrik formunun yuzlerinden biri degil, geneline de yayilabilir. Nitelim, benzer sekilde form follows function (und vice versa todo: ref) tartismalari da bu durumun farkli bir boyutunu yansitir.\r\n\r\n    Modern mimarinini sikici ve donuk kabul edilen formal tonlari, postmodern mimaride kendini populist, dikkat cekici, farkli ve renkli formlara birakmistir. Fakat ayni barokta oldugu gibi gordugumuz yapilar bir guc ve otorite odaginin kendini yeni teknoloji ve form ile resmetme seklidir. Arkadaki prensip ise baroktan cok farklilik gostermez. Nitekim, postmodern donem ayni zamanda neolibral nutuklar ile kapitalizmin ve gucun tek elde bu sefer farkli bir guc merkezi olan para ile toplandigi donem olmasi tesaduf degildir.\r\n\r\n    todo: barter system vs money as layer of commerce mathematically reducing the comlexity.\r\n\r\n    ##\r\n\r\n    ---\r\n\r\n    [^1]: Deutsher Bundestag. _Federal Almanya Cumhuriyeti Anayasasi [Constitution of the Federal Republic of Germany]_. 2022. Accessed (30 Oct 2023) https://www.btg-bestellservice.de/pdf/80207000.pdf\r\n\r\n\r\n\r\n    Bu ornekler umuyorum ki bu iki kavram aaraasindaki farki aktarmak icin ikna edici olmustur. Yazinin yonunu biraz saptirarak daha subtle bir ornek olaarak aslinda yazinin asil temasi olan mimarliga donmek istiyorum.\r\n\r\n    ---\r\n\r\n    #### Sonuc\r\n\r\n    -   [Referans]:\r\n\r\n\r\n    - [todo]:\r\n        -   [x] ferdinand saussure\r\n        -   [x] quassimodo | notre dame\r\n        -   [x] reklam teorisi\r\n        -   [x] para kavrami\r\n        -   [x] Alt metni okuma\r\n        -   [x] algi ve objenin birbirine iki fakrli kavram olmasi\r\n        -   [c] mimarlik cephe sorunsali\r\n        -   [c] mevlana ya oldugun gibi gorun ya gorundugun gibi ol\r\n        -   [c] fey kapitalizm video referans\r\n        -   [t] conclusiona ekle? earned over innate -&gt; alt metni okuma, elestirel olmayi ogrenme. adil toplumu amaclama\r\n        -   [ ] revise bastan asagi, temel vurguyu conclusionda temiz bitirdigine min ol\r\n\r\n    - [excluded]:\r\n        - modernite le corbusier in getirdiklerine karsi durma durumu\r\n        - earned over in
